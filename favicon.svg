<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- 与 index.html 的 grad 变量同色：蓝 → 青 → 紫 -->
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f6bff"/>
      <stop offset="55%" stop-color="#00b8d4"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f6bff" stop-opacity=".42"/>
      <stop offset="55%" stop-color="#00b8d4" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity=".38"/>
    </linearGradient>
  </defs>

  <!-- 白色玻璃底 + 渐变描边 -->
  <rect x="2" y="2" width="60" height="60" rx="15"
        fill="#ffffff" stroke="url(#edge)" stroke-width="1.4"/>
  <rect x="5" y="5" width="54" height="54" rx="12.5" fill="none"
        stroke="#4f6bff" stroke-opacity=".08" stroke-width="1"/>

  <!-- 柔和投影垫层（不用滤镜，跨浏览器一致） -->
  <rect x="13" y="16" width="38" height="38" rx="12" fill="#4f6bff" opacity=".13"/>

  <!-- 渐变主块：与卡片右下角 go 按钮 hover 态同构 -->
  <rect x="13" y="13" width="38" height="38" rx="12" fill="url(#grad)"/>
  <rect x="13" y="13" width="38" height="38" rx="12" fill="none"
        stroke="#ffffff" stroke-opacity=".30" stroke-width="1"/>
  <rect x="18" y="15.5" width="28" height="1.6" rx=".8" fill="#ffffff" opacity=".38"/>

  <!-- 白色箭头，16px 下仍可辨识 -->
  <path d="M26.5 37.5 L37.5 26.5 M30 26.5 H37.5 V34"
        fill="none" stroke="#ffffff" stroke-width="4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
