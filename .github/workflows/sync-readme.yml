name: Sync README from files.json

on:
  push:
    branches: [main, master]
    paths:
      - 'files.json'
      - 'README.md'
      - 'scripts/gen-readme.mjs'
      - '.github/workflows/sync-readme.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-readme
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Regenerate README demo section
        run: node scripts/gen-readme.mjs

      - name: Commit if changed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- README.md; then
            echo "README is already up to date, nothing to commit."
          else
            git add README.md
            git commit -m "chore: sync README demos from files.json [skip ci]"
            git push
          fi
