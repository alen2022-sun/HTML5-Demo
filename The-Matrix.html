<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HACK TERMINAL - SYSTEM BREACH</title>
    <style>
        :root {
            --green: #00ff41;
            --green-dim: #00aa2e;
            --green-glow: #00ff4188;
            --bg: #0a0a0a;
            --terminal-bg: #0d0d0d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', 'Source Code Pro', 'Consolas', 'Monaco', 'Liberation Mono', monospace;
            cursor: crosshair;
            user-select: none;
            -webkit-user-select: none;
        }

        /* ========== MATRIX RAIN CANVAS ========== */
        #matrixCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            opacity: 0.55;
        }

        /* ========== SCANLINE OVERLAY ========== */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: repeating-linear-gradient(0deg,
                    transparent,
                    transparent 2px,
                    rgba(0, 0, 0, 0.06) 2px,
                    rgba(0, 0, 0, 0.06) 4px);
        }

        .flicker {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
            background: transparent;
            animation: flicker 0.15s infinite;
        }

        @keyframes flicker {
            0% {
                background: rgba(0, 255, 65, 0.02);
            }
            5% {
                background: rgba(0, 255, 65, 0.0);
            }
            10% {
                background: rgba(0, 255, 65, 0.03);
            }
            15% {
                background: rgba(0, 255, 65, 0.0);
            }
            20% {
                background: rgba(0, 255, 65, 0.01);
            }
            50% {
                background: rgba(0, 255, 65, 0.0);
            }
            80% {
                background: rgba(0, 255, 65, 0.02);
            }
            100% {
                background: rgba(0, 255, 65, 0.0);
            }
        }

        /* ========== MAIN TERMINAL CONTAINER ========== */
        .terminal-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 820px;
            margin: 0 auto;
            padding-top: 8vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .terminal-header {
            width: 100%;
            background: #111;
            border: 1px solid var(--green-dim);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 0 15px var(--green-glow), inset 0 0 15px rgba(0, 255, 65, 0.03);
        }
        .terminal-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .terminal-dot.red {
            background: #ff5f56;
            box-shadow: 0 0 6px #ff5f5688;
        }
        .terminal-dot.yellow {
            background: #ffbd2e;
            box-shadow: 0 0 6px #ffbd2e88;
        }
        .terminal-dot.green-dot {
            background: #27c93f;
            box-shadow: 0 0 6px #27c93f88;
        }
        .terminal-title {
            color: var(--green-dim);
            font-size: 13px;
            margin-left: 12px;
            letter-spacing: 2px;
            text-shadow: 0 0 6px var(--green-glow);
        }

        .terminal-screen {
            width: 100%;
            background: rgba(13, 13, 13, 0.92);
            border: 1px solid var(--green-dim);
            border-radius: 0 0 8px 8px;
            padding: 20px 24px;
            min-height: 420px;
            max-height: 60vh;
            overflow-y: auto;
            box-shadow: 0 0 25px var(--green-glow), inset 0 0 40px rgba(0, 255, 65, 0.02);
            scroll-behavior: smooth;
            position: relative;
        }

        .terminal-screen::-webkit-scrollbar {
            width: 4px;
        }
        .terminal-screen::-webkit-scrollbar-track {
            background: transparent;
        }
        .terminal-screen::-webkit-scrollbar-thumb {
            background: var(--green-dim);
            border-radius: 2px;
        }

        /* ========== LOG LINES ========== */
        .log-line {
            color: var(--green);
            font-size: 14px;
            line-height: 1.7;
            white-space: pre-wrap;
            word-break: break-all;
            text-shadow: 0 0 4px var(--green-glow);
            animation: lineFadeIn 0.3s ease-out;
            opacity: 0;
            animation-fill-mode: forwards;
        }
        .log-line.prompt {
            color: #00ff41;
            font-weight: bold;
        }
        .log-line.info {
            color: #00cc88;
            text-shadow: 0 0 3px rgba(0, 204, 136, 0.5);
        }
        .log-line.warning {
            color: #ffcc00;
            text-shadow: 0 0 6px rgba(255, 204, 0, 0.6);
            animation: pulseWarning 0.8s ease-in-out infinite;
        }
        .log-line.error {
            color: #ff4444;
            text-shadow: 0 0 6px rgba(255, 68, 68, 0.6);
        }
        .log-line.success {
            color: #00ff88;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.8);
            font-size: 16px;
            font-weight: bold;
        }
        .log-line.highlight {
            color: #ffffff;
            text-shadow: 0 0 10px #00ff41, 0 0 20px #00ff41;
            font-size: 15px;
            font-weight: bold;
        }

        @keyframes lineFadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes pulseWarning {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .cursor-blink {
            display: inline-block;
            width: 8px;
            height: 16px;
            background: var(--green);
            margin-left: 2px;
            animation: blink 0.7s step-end infinite;
            vertical-align: middle;
            box-shadow: 0 0 8px var(--green);
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* ========== PROGRESS BAR ========== */
        .progress-wrapper {
            width: 100%;
            margin-top: 14px;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .progress-wrapper.visible {
            opacity: 1;
        }
        .progress-label {
            color: var(--green);
            font-size: 12px;
            margin-bottom: 4px;
            letter-spacing: 1px;
            text-shadow: 0 0 4px var(--green-glow);
            display: flex;
            justify-content: space-between;
        }
        .progress-bar-outer {
            width: 100%;
            height: 8px;
            background: #111;
            border: 1px solid var(--green-dim);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: inset 0 0 6px rgba(0, 0, 0, 0.8);
            position: relative;
        }
        .progress-bar-inner {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #003300, var(--green), #00ff88);
            border-radius: 3px;
            transition: width 0.15s linear;
            box-shadow: 0 0 12px var(--green-glow), 0 0 24px var(--green);
            position: relative;
        }
        .progress-bar-inner::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg,
                    transparent 0%,
                    rgba(255, 255, 255, 0.25) 30%,
                    rgba(255, 255, 255, 0.25) 60%,
                    transparent 100%);
            animation: progressShine 0.6s linear infinite;
        }
        @keyframes progressShine {
            from {
                transform: translateX(-100%);
            }
            to {
                transform: translateX(100%);
            }
        }

        /* ========== ACCESS GRANTED OVERLAY ========== */
        .access-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease-out;
        }
        .access-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .access-card {
            background: rgba(0, 0, 0, 0.9);
            border: 2px solid #00ff88;
            border-radius: 16px;
            padding: 40px 60px;
            text-align: center;
            box-shadow:
                0 0 40px rgba(0, 255, 136, 0.5),
                0 0 80px rgba(0, 255, 136, 0.25),
                0 0 120px rgba(0, 255, 136, 0.1),
                inset 0 0 30px rgba(0, 255, 136, 0.05);
            animation: cardPopIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes cardPopIn {
            from {
                transform: scale(0.3);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        .access-icon {
            font-size: 64px;
            margin-bottom: 16px;
            animation: iconPulse 1.5s ease-in-out infinite;
        }
        @keyframes iconPulse {
            0%,
            100% {
                transform: scale(1);
                filter: drop-shadow(0 0 15px #00ff88);
            }
            50% {
                transform: scale(1.1);
                filter: drop-shadow(0 0 30px #00ff88);
            }
        }
        .access-title {
            color: #00ff88;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 6px;
            text-shadow: 0 0 20px #00ff88, 0 0 40px #00ff88, 0 0 60px #00ff88;
            margin-bottom: 8px;
            font-family: 'Courier New', monospace;
        }
        .access-subtitle {
            color: #00cc66;
            font-size: 14px;
            letter-spacing: 3px;
            text-shadow: 0 0 8px rgba(0, 255, 136, 0.6);
            font-family: 'Courier New', monospace;
        }
        .access-ip {
            color: #888;
            font-size: 11px;
            margin-top: 12px;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
        }

        /* ========== SOUND TOGGLE BUTTON ========== */
        .sound-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 200;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid var(--green-dim);
            color: var(--green);
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            box-shadow: 0 0 12px var(--green-glow);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        .sound-btn:hover {
            background: rgba(0, 30, 0, 0.8);
            box-shadow: 0 0 22px var(--green);
            transform: scale(1.08);
        }
        .sound-btn.muted {
            border-color: #ff4444;
            color: #ff4444;
            box-shadow: 0 0 12px rgba(255, 68, 68, 0.4);
        }
        .sound-btn .icon {
            pointer-events: none;
            line-height: 1;
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 600px) {
            .terminal-container {
                width: 96%;
                padding-top: 4vh;
            }
            .terminal-screen {
                padding: 12px 14px;
                min-height: 300px;
                max-height: 50vh;
            }
            .log-line {
                font-size: 11px;
                line-height: 1.5;
            }
            .access-card {
                padding: 24px 32px;
            }
            .access-title {
                font-size: 22px;
                letter-spacing: 3px;
            }
            .access-icon {
                font-size: 40px;
            }
            .sound-btn {
                width: 38px;
                height: 38px;
                bottom: 16px;
                right: 16px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- Matrix Rain Background -->
    <canvas id="matrixCanvas"></canvas>

    <!-- Scanline & Flicker Effects -->
    <div class="scanlines"></div>
    <div class="flicker"></div>

    <!-- Sound Toggle -->
    <button class="sound-btn" id="soundBtn" title="音效开关">
        <span class="icon">🔊</span>
    </button>

    <!-- Access Granted Overlay -->
    <div class="access-overlay" id="accessOverlay">
        <div class="access-card">
            <div class="access-icon">🔓</div>
            <div class="access-title">ACCESS GRANTED</div>
            <div class="access-subtitle">S Y S T E M &nbsp; B R E A C H E D</div>
            <div class="access-ip">TARGET: 192.168.██.███ &nbsp;|&nbsp; ROOT SHELL ACTIVE</div>
        </div>
    </div>

    <!-- Terminal UI -->
    <div class="terminal-container">
        <div class="terminal-header">
            <span class="terminal-dot red"></span>
            <span class="terminal-dot yellow"></span>
            <span class="terminal-dot green-dot"></span>
            <span class="terminal-title">ROOT@BREACH:// TERMINAL</span>
        </div>
        <div class="terminal-screen" id="terminalScreen">
            <!-- Log lines injected by JS -->
        </div>
        <!-- Progress Bar injected inside terminalScreen -->
    </div>

    <script>
        (function() {
            // ==================== DOM REFS ====================
            const terminalScreen = document.getElementById('terminalScreen');
            const accessOverlay = document.getElementById('accessOverlay');
            const soundBtn = document.getElementById('soundBtn');
            const matrixCanvas = document.getElementById('matrixCanvas');
            const ctx = matrixCanvas.getContext('2d');

            // ==================== STATE ====================
            let soundEnabled = true;
            let audioCtx = null;
            let globalGain = null;
            let climaxTriggered = false;
            let accessGrantedShown = false;
            let logLineCount = 0;

            // ==================== AUDIO ENGINE ====================
            function getAudioContext() {
                if (!audioCtx) {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                    globalGain = audioCtx.createGain();
                    globalGain.gain.value = 0.12;
                    globalGain.connect(audioCtx.destination);
                }
                if (audioCtx.state === 'suspended') audioCtx.resume();
                return audioCtx;
            }

            function playBeep(freq, duration, type = 'square', vol = 0.15, glideTo = null) {
                if (!soundEnabled) return;
                try {
                    const ac = getAudioContext();
                    const t = ac.currentTime;
                    const osc = ac.createOscillator();
                    const gain = ac.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, t);
                    if (glideTo) osc.frequency.linearRampToValueAtTime(glideTo, t + duration);
                    gain.gain.setValueAtTime(vol, t);
                    gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
                    osc.connect(gain);
                    gain.connect(globalGain);
                    osc.start(t);
                    osc.stop(t + duration);
                } catch (e) { /* silent */ }
            }

            function playTypingClick() {
                playBeep(800 + Math.random() * 400, 0.03, 'square', 0.04);
            }

            function playProgressTick() {
                playBeep(1200 + Math.random() * 300, 0.05, 'square', 0.06);
            }

            function playWarningBeep() {
                playBeep(440, 0.25, 'sawtooth', 0.1, 220);
            }

            function playClimaxSound() {
                // Layered intense sound
                playBeep(200, 0.4, 'sawtooth', 0.15, 80);
                setTimeout(() => playBeep(600, 0.3, 'square', 0.12, 900), 150);
                setTimeout(() => playBeep(1000, 0.2, 'square', 0.1, 1400), 300);
                setTimeout(() => playBeep(2000, 0.5, 'sawtooth', 0.08, 3000), 450);
            }

            function playAccessGrantedSound() {
                // Triumphant chord-like sequence
                const notes = [523, 659, 784, 1047]; // C5, E5, G5, C6
                notes.forEach((freq, i) => {
                    setTimeout(() => playBeep(freq, 0.5, 'square', 0.1, freq * 1.05), i * 120);
                });
                // Sub bass
                setTimeout(() => playBeep(65, 1.2, 'sine', 0.2), 100);
            }

            // ==================== MATRIX RAIN ====================
            let columns = 0;
            let drops = [];
            const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZﾊﾐﾋｰｳｼﾅﾓﾆｻﾜﾂｵﾘｱﾎﾃﾏｹﾒｴｶｷﾑﾕﾗｾﾈｽﾀﾇﾍｦｲｸｺｿﾁﾄﾉﾌﾔﾖﾙﾚﾛﾝ';

            function initMatrixRain() {
                matrixCanvas.width = window.innerWidth;
                matrixCanvas.height = window.innerHeight;
                const fontSize = 14;
                columns = Math.floor(matrixCanvas.width / fontSize);
                drops = [];
                for (let i = 0; i < columns; i++) {
                    drops[i] = Math.random() * -matrixCanvas.height / fontSize;
                }
            }

            function drawMatrixRain() {
                const fontSize = 14;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
                ctx.fillRect(0, 0, matrixCanvas.width, matrixCanvas.height);
                ctx.fillStyle = '#00ff41';
                ctx.font = `bold ${fontSize}px "Courier New", monospace`;
                ctx.shadowColor = '#00ff41';
                ctx.shadowBlur = 4;

                for (let i = 0; i < drops.length; i++) {
                    const char = chars[Math.floor(Math.random() * chars.length)];
                    const x = i * fontSize;
                    const y = drops[i] * fontSize;

                    // Vary brightness
                    const brightness = 0.4 + Math.random() * 0.6;
                    ctx.fillStyle = `rgba(0, 255, 65, ${brightness})`;
                    ctx.fillText(char, x, y);

                    // Leading char brighter
                    if (Math.random() > 0.97) {
                        ctx.fillStyle = '#ffffff';
                        ctx.shadowBlur = 10;
                        ctx.fillText(char, x, y);
                        ctx.fillStyle = '#00ff41';
                        ctx.shadowBlur = 4;
                    }

                    if (y > matrixCanvas.height && Math.random() > 0.975) {
                        drops[i] = -Math.random() * 10;
                    }
                    drops[i] += 0.6 + Math.random() * 0.8;
                }
                ctx.shadowBlur = 0;
                requestAnimationFrame(drawMatrixRain);
            }

            window.addEventListener('resize', () => {
                initMatrixRain();
            });

            // ==================== TERMINAL LOG SYSTEM ====================
            function createLogLine(text, className = '') {
                const line = document.createElement('div');
                line.className = 'log-line ' + className;
                line.textContent = text;
                line.style.animationDelay = '0s';
                return line;
            }

            function appendLog(text, className = '') {
                const line = createLogLine(text, className);
                terminalScreen.appendChild(line);
                logLineCount++;
                // Auto-scroll
                terminalScreen.scrollTop = terminalScreen.scrollHeight;
                // Typing sound
                if (soundEnabled && logLineCount < 40) {
                    playTypingClick();
                }
                return line;
            }

            function appendLogWithDelay(text, className = '', delayMs = 0) {
                return new Promise(resolve => {
                    setTimeout(() => {
                        appendLog(text, className);
                        resolve();
                    }, delayMs);
                });
            }

            // ==================== PROGRESS BAR ====================
            let progressWrapper = null;
            let progressBarInner = null;
            let progressPercentSpan = null;

            function createProgressBar() {
                progressWrapper = document.createElement('div');
                progressWrapper.className = 'progress-wrapper';
                progressWrapper.innerHTML = `
                    <div class="progress-label">
                        <span>BREACH PROGRESS</span>
                        <span class="progress-percent">0%</span>
                    </div>
                    <div class="progress-bar-outer">
                        <div class="progress-bar-inner"></div>
                    </div>
                `;
                terminalScreen.appendChild(progressWrapper);
                progressBarInner = progressWrapper.querySelector('.progress-bar-inner');
                progressPercentSpan = progressWrapper.querySelector('.progress-percent');
                // Show it
                requestAnimationFrame(() => {
                    progressWrapper.classList.add('visible');
                });
            }

            function setProgress(percent) {
                if (!progressBarInner) return;
                const p = Math.min(100, Math.max(0, percent));
                progressBarInner.style.width = p + '%';
                if (progressPercentSpan) {
                    progressPercentSpan.textContent = Math.round(p) + '%';
                }
                if (soundEnabled && percent > 0 && percent < 99 && Math.random() > 0.65) {
                    playProgressTick();
                }
            }

            // ==================== MAIN SEQUENCE ====================
            async function runHackSequence() {
                // Phase 1: Initialization (0 - 1.0s)
                appendLog('┌─────────────────────────────────────────────┐', '');
                appendLog('│  █████╗ ███╗   ██╗ ██████╗ ███╗   ██╗       │', 'info');
                appendLog('│ ██╔══██╗████╗  ██║██╔═══██╗████╗  ██║       │', 'info');
                appendLog('│ ███████║██╔██╗ ██║██║   ██║██╔██╗ ██║       │', 'info');
                appendLog('│ ██╔══██║██║╚██╗██║██║   ██║██║╚██╗██║       │', 'info');
                appendLog('│ ██║  ██║██║ ╚████║╚██████╔╝██║ ╚████║       │', 'info');
                appendLog('│ ╚═╝  ╚═╝╚═╝  ╚═══╝ ╚═════╝ ╚═╝  ╚═══╝       │', 'info');
                appendLog('└─────────────────────────────────────────────┘', '');
                appendLog('', '');
                appendLog('[INFO] 初始化入侵模块...', 'info');
                appendLog('[INFO] 加载漏洞数据库 (CVE-2024-xxxx)...', 'info');
                appendLog('[INFO] 建立加密隧道到目标主机...', 'info');

                await sleep(400);
                appendLog('[SCAN] 扫描开放端口: 22, 80, 443, 3306, 8080, 8443...', '');
                await sleep(250);
                appendLog('[SCAN] 检测到防火墙: FortiGate v7.2.4', 'warning');
                await sleep(200);
                appendLog('[SCAN] 发现漏洞: CVE-2024-21887 (SSH Injection)', 'warning');

                // Create progress bar around 0.8s mark
                createProgressBar();
                setProgress(5);

                await sleep(300);
                appendLog('[EXPLOIT] 正在破解SSH密码...', '');
                setProgress(12);

                // Phase 2: Password cracking (1.0 - 2.5s)
                const fakePasswords = [
                    'admin:********',
                    'root:password123',
                    'user:admin2024',
                    'sa:SQL@dm1n!',
                    'root:toor',
                    'admin:letmein',
                    'root:root123!',
                    'admin:P@ssw0rd',
                    'root:r00t!!@#',
                ];

                for (let i = 0; i < fakePasswords.length; i++) {
                    await sleep(100 + Math.random() * 80);
                    const style = i < 5 ? '' : (i < 7 ? 'warning' : '');
                    appendLog(`  [TRY ${i+1}/${fakePasswords.length}] ${fakePasswords[i]} → FAILED`, style);
                    setProgress(12 + (i / fakePasswords.length) * 35);
                }

                await sleep(200);
                appendLog('  [TRY 10/10] root:r00t_k1ng! → MATCH! ✓', 'success');
                setProgress(52);
                playBeep(880, 0.2, 'square', 0.08);

                await sleep(350);
                appendLog('', '');
                appendLog('[SSH] 已获取 ROOT 权限!', 'success');
                appendLog('[SSH] 建立持久化后门...', 'info');
                setProgress(60);

                await sleep(400);
                appendLog('[DB] 转储用户凭证表...', '');
                appendLog('[DB] 提取: user_id, email, password_hash, salt...', '');
                setProgress(68);

                // Phase 3: Escalation / Climax build (2.5 - 3.0s)
                await sleep(300);
                appendLog('', '');
                appendLog('[!] 检测到入侵检测系统 (IDS) 扫描...', 'warning');
                await sleep(200);
                appendLog('[!] 正在绕过 Snort 规则集...', 'warning');
                setProgress(75);
                playWarningBeep();

                await sleep(250);
                appendLog('[!] IDS 已绕过! 继续渗透...', 'success');
                setProgress(82);

                // Climax approaching
                await sleep(200);
                appendLog('', '');
                appendLog('[>>>] 提权攻击启动...', 'highlight');
                setProgress(88);
                playClimaxSound();

                // Rapid fire logs (climax)
                const climaxLogs = [
                    '[ROOT] uid=0(root) gid=0(root) groups=0(root)',
                    '[ROOT] 内核模块加载: rootkit.ko',
                    '[ROOT] 清除日志: /var/log/auth.log',
                    '[ROOT] 清除日志: /var/log/syslog',
                    '[ROOT] 清除日志: /var/log/secure',
                    '[ROOT] 禁用审计守护进程...',
                    '[ROOT] 修改 /etc/shadow...',
                    '[ROOT] 添加后门账户: sysd@m1n',
                    '[ROOT] SSH密钥已植入...',
                    '[ROOT] 反弹Shell已建立: nc -e /bin/bash',
                ];

                for (let i = 0; i < climaxLogs.length; i++) {
                    await sleep(60 + Math.random() * 50);
                    const cls = i < 2 ? 'highlight' : (i < 7 ? 'success' : 'success');
                    appendLog(climaxLogs[i], cls);
                    setProgress(88 + (i / climaxLogs.length) * 12);
                    if (soundEnabled && i % 3 === 0) playBeep(1500, 0.06, 'square', 0.05);
                }

                setProgress(100);
                await sleep(300);

                // Final lines
                appendLog('', '');
                appendLog('╔══════════════════════════════════════════════╗', 'success');
                appendLog('║     █████╗  ██████╗ ██████╗ ███████╗██████╗ ║', 'success');
                appendLog('║    ██╔══██╗██╔════╝██╔════╝ ██╔════╝██╔══██╗║', 'success');
                appendLog('║    ███████║██║     ██║  ███╗█████╗  ██████╔╝║', 'success');
                appendLog('║    ██╔══██║██║     ██║   ██║██╔══╝  ██╔══██╗║', 'success');
                appendLog('║    ██║  ██║╚██████╗╚██████╔╝███████╗██║  ██║║', 'success');
                appendLog('║    ╚═╝  ╚═╝ ╚═════╝ ╚═════╝ ╚══════╝╚═╝  ╚═╝║', 'success');
                appendLog('╚══════════════════════════════════════════════╝', 'success');
                appendLog('', '');
                appendLog('>>> SYSTEM COMPROMISED <<<', 'highlight');
                appendLog('>>> ROOT SHELL ACTIVE <<<', 'highlight');
                appendLog('', '');
                appendLog('root@target:~# ', 'prompt');
                // Add blinking cursor
                const lastLine = terminalScreen.lastElementChild;
                if (lastLine) {
                    const cursor = document.createElement('span');
                    cursor.className = 'cursor-blink';
                    lastLine.appendChild(cursor);
                }

                // Trigger Access Granted overlay
                await sleep(400);
                showAccessGranted();
            }

            function showAccessGranted() {
                if (accessGrantedShown) return;
                accessGrantedShown = true;
                playAccessGrantedSound();
                accessOverlay.classList.add('active');

                // Add a subtle screen shake
                document.body.style.animation = 'screenShake 0.4s ease-out';
                setTimeout(() => {
                    document.body.style.animation = '';
                }, 400);

                // Glitch the progress bar
                if (progressBarInner) {
                    progressBarInner.style.background =
                        'linear-gradient(90deg, #003300, #00ff88, #ffffff, #00ff88, #003300)';
                    progressBarInner.style.boxShadow = '0 0 30px #00ff88, 0 0 60px #00ff88';
                }
            }

            // Inline keyframe for screen shake
            const shakeStyle = document.createElement('style');
            shakeStyle.textContent = `
                @keyframes screenShake {
                    0%,100% { transform: translate(0); }
                    10% { transform: translate(-4px, 2px); }
                    20% { transform: translate(4px, -2px); }
                    30% { transform: translate(-3px, -1px); }
                    40% { transform: translate(3px, 1px); }
                    50% { transform: translate(-2px, -3px); }
                    60% { transform: translate(2px, 3px); }
                    70% { transform: translate(-1px, 2px); }
                    80% { transform: translate(1px, -2px); }
                    90% { transform: translate(-3px, 0); }
                }
            `;
            document.head.appendChild(shakeStyle);

            // ==================== UTILS ====================
            function sleep(ms) {
                return new Promise(resolve => setTimeout(resolve, ms));
            }

            // ==================== SOUND TOGGLE ====================
            soundBtn.addEventListener('click', () => {
                soundEnabled = !soundEnabled;
                if (soundEnabled) {
                    soundBtn.classList.remove('muted');
                    soundBtn.querySelector('.icon').textContent = '🔊';
                    // Quick test beep
                    playBeep(800, 0.1, 'square', 0.06);
                } else {
                    soundBtn.classList.add('muted');
                    soundBtn.querySelector('.icon').textContent = '🔇';
                }
            });

            // Initialize AudioContext on first user interaction (required by browsers)
            document.addEventListener('click', () => {
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            }, { once: false });

            // ==================== RESTART ON CLICK OVERLAY ====================
            accessOverlay.addEventListener('click', () => {
                // Fade out overlay
                accessOverlay.classList.remove('active');
                accessGrantedShown = false;
                climaxTriggered = false;
                logLineCount = 0;
                // Clear terminal
                terminalScreen.innerHTML = '';
                progressWrapper = null;
                progressBarInner = null;
                progressPercentSpan = null;
                // Restart
                setTimeout(() => runHackSequence(), 400);
            });

            // ==================== INIT ====================
            function init() {
                initMatrixRain();
                drawMatrixRain();
                // Start sequence after a brief moment
                setTimeout(() => runHackSequence(), 300);
            }

            // Handle page visibility (pause/resume audio)
            document.addEventListener('visibilitychange', () => {
                if (document.hidden && audioCtx && audioCtx.state === 'running') {
                    // Don't suspend, just let it be
                }
            });

            init();

            console.log('%c👾 HACK TERMINAL READY %c| %cClick sound button for audio toggle',
                'color:#00ff41;font-size:16px;',
                '',
                'color:#888;');
            console.log('%c██████████████████████████████████████████████████',
                'color:#00ff41;');
            console.log('%c  SYSTEM INITIALIZED • WAITING FOR BREACH SEQUENCE  ',
                'color:#00ff41;');
            console.log('%c██████████████████████████████████████████████████',
                'color:#00ff41;');
        })();
    </script>
