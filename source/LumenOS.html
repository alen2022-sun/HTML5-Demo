const MINES_LEVELS={
  easy:{cols:9,rows:9,n:10},normal:{cols:12,rows:10,n:22},hard:{cols:16,rows:10,n:32}
};
const Mines={
  level:'easy',cells:[],state:'ready',flags:0,revealed:0,time:0,timer:0,flagMode:false,
  init(){this.newGame('easy',true)},
  L(){return MINES_LEVELS[this.level]},
  newGame(level,silent){
    this.stopTimer();
    if(MINES_LEVELS[level])this.level=level;
    const L=this.L();
    this.cells=Array.from({length:L.rows*L.cols},()=>({mine:false,adj:0,open:false,flag:false}));
    this.state='ready';this.flags=0;this.revealed=0;this.time=0;this.flagMode=false;
    if(!silent)this.repaint();
  },
  repaint(){const st=Windows.state&&Windows.state.mines;
    if(st&&st.el)st.el.querySelector('.win-body').innerHTML=WINDEF.mines.body()},
  html(){
    const L=this.L();
    const cell=this.level==='easy'?32:this.level==='normal'?25:18;
    const seg=`<div class="seg">${['easy','normal','hard'].map(k=>
      `<button data-action="mines-level" data-level="${k}" class="${k===this.level?'on':''}">${esc(t('win.mines.level.'+k))}</button>`).join('')}</div>`;
    const grid=this.cells.map((c,i)=>{
      const cls=['mine-cell'];let inner='';
      if(c.open){cls.push('revealed');
        if(c.mine){cls.push('boom');inner=icon('mine')}
        else if(c.adj>0)inner=String(c.adj);
      }else if(c.flag){cls.push('flag');inner=icon('flag')}
      return `<button class="${cls.join(' ')}" data-action="mine-cell" data-cell="${i}" data-n="${c.adj}" aria-label="${i}">${inner}</button>`;
    }).join('');
    let cls='mines-msg',msg=esc(t('win.mines.tip'));
    if(this.state==='won'){cls+=' is-win';msg=`<b>${esc(t('win.mines.win.t'))}</b> · ${esc(t('win.mines.win'))}`}
    else if(this.state==='lost'){cls+=' is-lose';msg=`<b>✕</b> ${esc(t('win.mines.lose'))}`}
    return `<div class="mines">
      <div class="mines-top">${seg}
        <span class="mines-stat">${icon('flag')}<b>${Math.max(0,L.n-this.flags)}</b> ${esc(t('win.mines.left'))}</span>
        <span class="mines-stat">${icon('clock')}<b id="mine-time">${String(this.time).padStart(3,'0')}</b> ${esc(t('win.mines.time'))}</span>
      </div>
      <div class="mines-top">
        <button class="btn ghost" data-action="mines-new">${icon('restart')}<span>${esc(t('win.mines.new'))}</span></button>
        <button class="btn ghost mines-btn ${this.flagMode?'on':''}" data-action="mines-mode" aria-pressed="${this.flagMode}">${icon('flag')}<span>${esc(t('win.mines.mode'))}</span></button>
        <span style="flex:1"></span>
        <span class="tiny muted">${L.cols} × ${L.rows} · ${L.n}</span>
      </div>
      <div class="mines-board" style="--cols:${L.cols};--cell:${cell}px">${grid}</div>
      <div class="${cls}">${msg}</div>
    </div>`;
  },
  neighbors(i){
    const L=this.L(),r=Math.floor(i/L.cols),c=i%L.cols,out=[];
    for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
      if(!dr&&!dc)continue;const rr=r+dr,cc=c+dc;
      if(rr>=0&&rr<L.rows&&cc>=0&&cc<L.cols)out.push(rr*L.cols+cc);
    }return out;
  },
  placeMines(safe){
    const L=this.L(),N=L.rows*L.cols,safeSet=new Set([safe]);
    this.neighbors(safe).forEach(n=>safeSet.add(n));   // 首次点击必为安全区
    const pool=[];for(let k=0;k<N;k++)if(!safeSet.has(k))pool.push(k);
    for(let m=0;m<L.n&&pool.length;m++){
      const idx=pool.splice(Math.floor(Math.random()*pool.length),1)[0];
      this.cells[idx].mine=true;
    }
    for(let k=0;k<N;k++)if(!this.cells[k].mine)
      this.cells[k].adj=this.neighbors(k).filter(n=>this.cells[n].mine).length;
  },
  flood(i){
    const stack=[i];
    while(stack.length){
      const k=stack.pop(),c=this.cells[k];
      if(!c||c.open||c.flag||c.mine)continue;
      c.open=true;this.revealed++;
      if(c.adj===0)this.neighbors(k).forEach(n=>{if(!this.cells[n].open)stack.push(n)});
    }
  },
  open(i){
    if(this.state==='won'||this.state==='lost')return;
    const c=this.cells[i];if(!c||c.open)return;
    if(this.flagMode||c.flag){this.flag(i);return}
    if(this.state==='ready'){this.placeMines(i);this.state='playing';this.startTimer()}
    if(c.mine){
      c.open=true;this.state='lost';this.stopTimer();
      this.cells.forEach(x=>{if(x.mine)x.open=true});
    }else{
      this.flood(i);
      const L=this.L();
      if(this.revealed===L.rows*L.cols-L.n){
        this.state='won';this.stopTimer();
        this.cells.forEach(x=>{if(x.mine)x.flag=true});this.flags=L.n;
        Notifications.push('shield',t('win.mines.win.t'),t('win.mines.win.b'));
      }
    }
    this.repaint();
  },
  flag(i){
    if(this.state==='won'||this.state==='lost')return;
    const c=this.cells[i];if(!c||c.open)return;
    c.flag=!c.flag;this.flags+=c.flag?1:-1;this.repaint();
  },
  toggleMode(){this.flagMode=!this.flagMode;this.repaint()},
  tick(){if(this.state==='playing'&&!document.hidden){this.time++;
    const el=$('#mine-time');if(el)el.textContent=String(this.time).padStart(3,'0')}},
  startTimer(){if(this.timer)return;this.timer=setInterval(()=>this.tick(),1000)},
  stopTimer(){clearInterval(this.timer);this.timer=0}
};

/* ---------- 11b. 画板：离屏画布持有像素，窗口重绘不丢内容 ---------- */
const Paint={
  W:520,H:290,DPR:1,bg:'#0d1220',
  off:null,octx:null,canvas:null,dctx:null,
  tool:'brush',color:'#7C9BFF',size:6,
  colors:['#7C9BFF','#52E0C4','#FFC36B','#FF7A7A','#C9A2FF','#F4F7FF','#8FD3FF','#2B3446'],
  stack:[],future:[],drag:null,
  TOOLS:[['brush','brush','paint.brush'],['line','line','paint.line'],
         ['rect','rect','paint.rect'],['ellipse','circle','paint.ellipse'],
         ['eraser','eraser','paint.eraser'],['fill','fill','paint.fill']],
  init(){
    this.DPR=Math.min(window.devicePixelRatio||1,2);
    this.off=document.createElement('canvas');
    this.off.width=this.W*this.DPR;this.off.height=this.H*this.DPR;
    this.octx=this.off.getContext('2d',{willReadFrequently:true});
    this.octx.setTransform(this.DPR,0,0,this.DPR,0,0);
    this.octx.fillStyle=this.bg;this.octx.fillRect(0,0,this.W,this.H);
    this.stack=[];this.future=[];
  },
  html(){
    return `<div class="paint">
      <div class="paint-tools">
        ${this.TOOLS.map(([k,ic,key])=>`<button class="paint-tool ${this.tool===k?'on':''}" data-action="paint-tool" data-tool="${k}"
          aria-label="${esc(t(key))}" title="${esc(t(key))}">${icon(ic)}</button>`).join('')}
        <span class="paint-vsep"></span>
        <button class="paint-tool" data-action="paint-undo" aria-label="${esc(t('paint.undo'))}" title="${esc(t('paint.undo'))}">${icon('undo')}</button>
        <button class="paint-tool" data-action="paint-redo" aria-label="${esc(t('paint.redo'))}" title="${esc(t('paint.redo'))}">${icon('redo')}</button>
        <button class="paint-tool" data-action="paint-clear" aria-label="${esc(t('paint.clear'))}" title="${esc(t('paint.clear'))}">${icon('trash')}</button>
        <button class="paint-tool" data-action="paint-export" aria-label="${esc(t('paint.export'))}" title="${esc(t('paint.export'))}">${icon('download')}</button>
      </div>
      <div class="paint-opts">
        <span class="eyebrow">${esc(t('paint.color'))}</span>
        <div class="paint-swatches">${this.colors.map(c=>`<button class="paint-sw ${c.toLowerCase()===this.color.toLowerCase()?'on':''}"
          data-action="paint-color" data-color="${c}" style="background:${c}" aria-label="${c}"></button>`).join('')}</div>
        <input type="color" class="paint-color" data-paint-color value="${esc(this.color)}" aria-label="${esc(t('paint.color'))}">
        <span class="paint-vsep"></span>
        <span class="eyebrow">${esc(t('paint.size'))}</span>
        <input type="range" class="paint-size" data-paint-size min="1" max="30" value="${this.size}"
          aria-label="${esc(t('paint.size'))}" style="--val:${(this.size/30*100).toFixed(1)}%">
        <span class="paint-size-label" data-paint-size-label>${this.size}px</span>
      </div>
      <div class="paint-stage"><canvas class="paint-canvas" data-paint-canvas aria-label="${esc(t('win.paint.title'))}"></canvas></div>
      <div class="paint-foot">
        <span class="paint-hint">${esc(t('paint.hint'))}</span><span class="grow"></span>
        <span class="pill"><span class="dot"></span>${esc(t('win.paint.key'))}</span>
      </div></div>`;
  },
  mount(){
    const c=document.querySelector('[data-paint-canvas]');if(!c)return;
    c.width=this.W*this.DPR;c.height=this.H*this.DPR;
    this.canvas=c;this.dctx=c.getContext('2d');
    this.dctx.setTransform(this.DPR,0,0,this.DPR,0,0);
    this.sync();this.refresh();
  },
  ensure(){
    const c=document.querySelector('[data-paint-canvas]');if(!c)return false;
    if(c!==this.canvas){
      c.width=this.W*this.DPR;c.height=this.H*this.DPR;
      this.canvas=c;this.dctx=c.getContext('2d');
      this.dctx.setTransform(this.DPR,0,0,this.DPR,0,0);
    }
    return true;
  },
  refresh(){
    if(!this.ensure())return;
    this.dctx.clearRect(0,0,this.W,this.H);
    this.dctx.drawImage(this.off,0,0,this.W,this.H);
  },
  sync(){
    $$('.paint-tool[data-tool]').forEach(b=>b.classList.toggle('on',b.dataset.tool===this.tool));
    $$('.paint-sw').forEach(b=>b.classList.toggle('on',b.dataset.color.toLowerCase()===this.color.toLowerCase()));
    const ci=$('[data-paint-color]');if(ci)ci.value=this.color;
    const si=$('[data-paint-size]');if(si){si.value=this.size;si.style.setProperty('--val',(this.size/30*100).toFixed(1)+'%')}
    const sl=$('[data-paint-size-label]');if(sl)sl.textContent=this.size+'px';
  },
  setTool(k){if(!this.TOOLS.some(x=>x[0]===k))return;this.tool=k;this.sync()},
  setColor(c){if(!/^#[0-9a-fA-F]{6}$/.test(c))return;this.color=c;this.sync()},
  setSize(v){this.size=clamp(Math.round(+v)||1,1,30);this.sync()},
  snapshot(){
    this.stack.push(this.octx.getImageData(0,0,this.off.width,this.off.height));
    if(this.stack.length>14)this.stack.shift();this.future=[];
  },
  undo(){
    if(!this.stack.length)return;
    this.future.push(this.octx.getImageData(0,0,this.off.width,this.off.height));
    this.octx.putImageData(this.stack.pop(),0,0);this.refresh();
  },
  redo(){
    if(!this.future.length)return;
    this.stack.push(this.octx.getImageData(0,0,this.off.width,this.off.height));
    this.octx.putImageData(this.future.pop(),0,0);this.refresh();
  },
  clear(){
    this.snapshot();this.octx.fillStyle=this.bg;
    this.octx.fillRect(0,0,this.W,this.H);this.refresh();
    Notifications.push('trash',t('paint.cleared.t'),t('paint.cleared.b'));
  },
  fill(){
    this.snapshot();this.octx.fillStyle=this.color;
    this.octx.fillRect(0,0,this.W,this.H);this.refresh();
  },
  shape(ctx,tool,a,b,color,size){
    const er=tool==='eraser';
    ctx.save();ctx.lineCap='round';ctx.lineJoin='round';
    ctx.strokeStyle=er?this.bg:color;ctx.lineWidth=er?size*2.6:size;
    if(tool==='brush'||tool==='eraser'){
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }else if(tool==='line'){
      ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
    }else if(tool==='rect'){
      ctx.strokeRect(Math.min(a.x,b.x),Math.min(a.y,b.y),Math.abs(b.x-a.x),Math.abs(b.y-a.y));
    }else if(tool==='ellipse'){
      ctx.beginPath();ctx.ellipse((a.x+b.x)/2,(a.y+b.y)/2,
        Math.abs(b.x-a.x)/2,Math.abs(b.y-a.y)/2,0,0,6.2832);ctx.stroke();
    }
    ctx.restore();
  },
  pos(e){
    const r=this.canvas.getBoundingClientRect();
    return {x:clamp((e.clientX-r.left)/r.width*this.W,0,this.W),
            y:clamp((e.clientY-r.top)/r.height*this.H,0,this.H)};
  },
  start(e){
    if(!e.target.closest||!e.target.closest('[data-paint-canvas]'))return;
    e.preventDefault();this.ensure();
    const p=this.pos(e);
    if(this.tool==='fill'){this.fill();return}
    this.snapshot();
    this.drag={a:p,last:p,tool:this.tool,color:this.color,size:this.size};
    if(this.tool==='brush'||this.tool==='eraser')
      this.shape(this.octx,this.tool,p,p,this.color,this.size);
    this.refresh();
    try{e.target.setPointerCapture(e.pointerId)}catch(err){}
  },
  move(e){
    if(!this.drag)return;
    const p=this.pos(e),d=this.drag;
    if(d.tool==='brush'||d.tool==='eraser'){
      this.shape(this.octx,d.tool,d.last,p,d.color,d.size);d.last=p;this.refresh();
    }else{
      this.refresh();this.shape(this.dctx,d.tool,d.a,p,d.color,d.size);
    }
  },
  end(e){
    if(!this.drag)return;
    const d=this.drag,p=(e&&e.clientX!==undefined)?this.pos(e):d.last;
    if(d.tool!=='brush'&&d.tool!=='eraser')
      this.shape(this.octx,d.tool,d.a,p,d.color,d.size);
    this.drag=null;this.refresh();
  },
  exportPNG(){
    try{
      const dl=url=>{const a=document.createElement('a');a.href=url;a.download='Lumen-Paint.png';
        document.body.appendChild(a);a.click();a.remove();};
      if(this.off.toBlob)this.off.toBlob(b=>{if(!b)return;
        const u=URL.createObjectURL(b);dl(u);setTimeout(()=>URL.revokeObjectURL(u),1500)},'image/png');
      else dl(this.off.toDataURL('image/png'));
    }catch(e){}
  }
};

/* ---------- 11c. 红心大战：四家、传牌、跟花色、计分与射月 ---------- */
const SUIT_CHAR={S:'♠',H:'♥',D:'♦',C:'♣'};
const SEAT_KEYS=['hearts.you','hearts.west','hearts.north','hearts.east'];
const SUIT_ORDER={C:0,D:1,S:2,H:3};
const cardCmp=(a,b)=>SUIT_ORDER[a.s]-SUIT_ORDER[b.s]||b.r-a.r;
const rankLabel=r=>({11:'J',12:'Q',13:'K',14:'A'})[r]||String(r);
const cardKey=c=>c.s+c.r;

const Hearts={
  phase:'idle',round:0,scores:[0,0,0,0],taken:[0,0,0,0],
  hands:[[],[],[],[]],trick:[],lead:0,turn:0,trickNo:0,
  broken:false,firstTrick:true,selected:[],showRules:false,timer:0,
  msg:{key:'hearts.msg.new',vars:{}},
  init(){clearTimeout(this.timer)},
  setMsg(key,vars){this.msg={key,vars:vars||{}}},
  passLabel(dir){
    const map={1:1,2:3,3:2};
    return LOCALE==='zh'?t(SEAT_KEYS[map[dir]]):t('hearts.pass.'+({1:'left',2:'right',3:'across'}[dir]));
  },
  msgVars(){
    const v=this.msg.vars||{},o={};for(const k in v)o[k]=v[k];
    if(v.p!==undefined)o.p=t(SEAT_KEYS[v.p]);
    if(v.dir!==undefined)o.p=this.passLabel(v.dir);
    if(v.s!==undefined)o.s=t('hearts.suit.'+v.s);
    return o;
  },
  newGame(){clearTimeout(this.timer);this.scores=[0,0,0,0];this.round=0;this.startHand()},
  startHand(){
    clearTimeout(this.timer);this.round++;
    const deck=[];
    for(const s of ['S','H','D','C'])for(let r=2;r<=14;r++)deck.push({s,r});
    for(let i=deck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}
    this.hands=[0,1,2,3].map(p=>deck.slice(p*13,p*13+13).sort(cardCmp));
    this.taken=[0,0,0,0];this.trick=[];this.trickNo=0;
    this.broken=false;this.firstTrick=true;this.selected=[];
    this.lead=0;this.turn=0;
    const dir=this.round%4;
    if(dir===0){this.phase='play';this.beginPlay(false)}
    else{this.phase='pass';this.setMsg('hearts.msg.pass',{dir,n:0})}
    this.repaint();
  },
  beginPlay(passed){
    const holder=this.hands.findIndex(h=>h.some(c=>c.s==='C'&&c.r===2));
    this.lead=Math.max(0,holder);this.turn=this.lead;
    this.trick=[];this.trickNo=0;this.firstTrick=true;this.broken=false;
    this.selected=[];this.phase='play';
    this.setMsg(passed?'hearts.msg.passDone':'hearts.msg.lead',{p:this.lead});
    if(this.turn===0)this.updateTurnMsg();
    this.repaint();this.schedule();
  },
  findCard(p,key){const c=this.hands[p].find(x=>cardKey(x)===key);return c||null},
  weight(c){if(c.s==='S'&&c.r===12)return 100;if(c.s==='H')return 50+c.r;return c.r},
  aiPass(p){return this.hands[p].slice().sort((a,b)=>this.weight(b)-this.weight(a)).slice(0,3)},
  confirmPass(){
    if(this.selected.length!==3){this.setMsg('hearts.msg.need3');this.syncHand();return}
    const dir=this.round%4,offset=({1:1,2:3,3:2})[dir];
    const sets=[[],[],[],[]];
    sets[0]=this.selected.map(k=>this.findCard(0,k)).filter(Boolean);
    for(let p=1;p<4;p++)sets[p]=this.aiPass(p);
    for(let p=0;p<4;p++)
      this.hands[p]=this.hands[p].filter(c=>!sets[p].some(x=>x.s===c.s&&x.r===c.r));
    for(let p=0;p<4;p++){
      const target=(p+offset)%4;
      this.hands[target]=this.hands[target].concat(sets[p]).sort(cardCmp);
    }
    this.selected=[];this.beginPlay(true);
  },
  legal(p){
    const h=this.hands[p];
    if(!this.trick.length){
      if(this.firstTrick)return h.filter(c=>c.s==='C'&&c.r===2);
      const nonH=h.filter(c=>c.s!=='H');
      return (this.broken||!nonH.length)?h.slice():nonH;
    }
    const s=this.trick[0].card.s;
    const same=h.filter(c=>c.s===s);
    if(same.length)return same;
    if(this.firstTrick){
      const safe=h.filter(c=>c.s!=='H'&&!(c.s==='S'&&c.r===12));
      return safe.length?safe:h.slice();
    }
    return h.slice();
  },
  updateTurnMsg(){
    if(this.turn===0)this.setMsg(this.firstTrick?'hearts.msg.first':'hearts.msg.your');
    else this.setMsg('hearts.msg.think',{p:this.turn});
  },
  schedule(){
    clearTimeout(this.timer);
    if(this.phase!=='play'||this.turn===0||document.hidden)return;
    this.timer=setTimeout(()=>{
      if(this.phase!=='play'||this.turn===0)return;
      this.play(this.turn,this.aiChoose(this.turn));
    },520);
  },
  aiChoose(p){
    const legal=this.legal(p);
    if(!legal.length)return this.hands[p][0];
    if(!this.trick.length)
      return legal.slice().sort((a,b)=>this.weight(a)-this.weight(b))[0];
    const s=this.trick[0].card.s,same=legal.filter(c=>c.s===s);
    if(same.length){
      const maxR=Math.max(...this.trick.filter(x=>x.card.s===s).map(x=>x.card.r));
      const losing=same.filter(c=>c.r<maxR).sort((a,b)=>b.r-a.r);
      if(losing.length)return losing[0];
      return same.slice().sort((a,b)=>a.r-b.r)[0];
    }
    const q=legal.find(c=>c.s==='S'&&c.r===12);if(q)return q;
    const hs=legal.filter(c=>c.s==='H').sort((a,b)=>b.r-a.r);if(hs.length)return hs[0];
    return legal.slice().sort((a,b)=>b.r-a.r)[0];
  },
  play(p,card){
    if(!card)return;
    const i=this.hands[p].findIndex(c=>c.s===card.s&&c.r===card.r);
    if(i<0)return;
    this.hands[p].splice(i,1);
    this.trick.push({p,card});
    if(card.s==='H')this.broken=true;
    this.selected=[];
    if(this.trick.length===4){
      this.phase='trickEnd';this.repaint();
      clearTimeout(this.timer);this.timer=setTimeout(()=>this.resolveTrick(),780);
    }else{
      this.turn=(p+1)%4;this.updateTurnMsg();this.repaint();this.schedule();
    }
  },
  resolveTrick(){
    const s=this.trick[0].card.s;
    const cands=this.trick.filter(x=>x.card.s===s);
    let win=cands[0];for(const x of cands)if(x.card.r>win.card.r)win=x;
    let pts=0;
    for(const x of this.trick){const c=x.card;
      if(c.s==='H')pts++;else if(c.s==='S'&&c.r===12)pts+=13}
    this.taken[win.p]+=pts;this.firstTrick=false;this.trickNo++;
    this.lead=win.p;this.turn=win.p;
    this.setMsg('hearts.msg.trick',{p:win.p,n:pts});
    this.phase='trickEnd';this.repaint();
    clearTimeout(this.timer);
    this.timer=setTimeout(()=>this.nextTrick(win.p),900);
  },
  nextTrick(winner){
    if(this.trickNo>=13){this.endHand();return}
    this.trick=[];this.turn=winner;this.lead=winner;this.phase='play';
    this.updateTurnMsg();this.repaint();this.schedule();
  },
  endHand(){
    clearTimeout(this.timer);
    let shooter=-1;
    for(let p=0;p<4;p++)if(this.taken[p]===26){shooter=p;break}
    if(shooter>=0){for(let p=0;p<4;p++)if(p!==shooter)this.scores[p]+=26}
    else{for(let p=0;p<4;p++)this.scores[p]+=this.taken[p]}
    const lowest=Math.min(...this.scores),winner=this.scores.indexOf(lowest);
    if(Math.max(...this.scores)>=100){
      this.phase='gameEnd';
      this.setMsg('hearts.msg.gameEnd',{p:winner,n:lowest});
      Notifications.push('heart',t('hearts.win.t'),t('hearts.win.b'));
    }else{
      this.phase='handEnd';
      this.setMsg(shooter>=0?'hearts.msg.handEnd':'hearts.msg.handEnd2',{p:shooter>=0?shooter:0});
    }
    this.repaint();
  },
  // 只同步牌面选中态与提示，不重建 DOM —— 连续点选 3 张牌时不会丢失后续点击
  syncHand(){
    const ph=this.phase,legal=(ph==='play'&&this.turn===0)?this.legal(0):null;
    $$('.pcard-btn').forEach(b=>{
      const k=b.dataset.card,c=this.findCard(0,k);
      const ok=ph==='pass'?true:(!!legal&&!!c&&legal.some(x=>x.s===c.s&&x.r===c.r));
      b.classList.toggle('sel',this.selected.includes(k));
      b.classList.toggle('disabled',!ok);
    });
    const m=$('.hearts-msg');if(m)m.textContent=t(this.msg.key,this.msgVars());
  },
  select(key){
    if(this.phase==='pass'){
      const i=this.selected.indexOf(key);
      if(i>=0)this.selected.splice(i,1);
      else if(this.selected.length<3)this.selected.push(key);
      this.setMsg('hearts.msg.pass',{dir:this.round%4,n:this.selected.length});
      this.syncHand();return;
    }
    if(this.phase!=='play'||this.turn!==0)return;
    const c=this.findCard(0,key),legal=this.legal(0);
    if(!c||!legal.some(x=>x.s===c.s&&x.r===c.r)){this.setMsg('hearts.msg.badCard');this.syncHand();return}
    this.selected=[key];this.syncHand();
  },
  userPlay(){
    if(this.phase!=='play'||this.turn!==0)return;
    const c=this.selected.length?this.findCard(0,this.selected[0]):null,legal=this.legal(0);
    if(!c||!legal.some(x=>x.s===c.s&&x.r===c.r)){this.setMsg('hearts.msg.badCard');this.syncHand();return}
    this.play(0,c);
  },
  cardHTML(c,btn,extra){
    const red=c.s==='H'||c.s==='D',rk=rankLabel(c.r),cls=`pcard ${red?'red':''} ${extra||''}`;
    const inner=`<span class="rk">${rk}</span><span class="st">${SUIT_CHAR[c.s]}</span>`;
    return btn?`<button class="${cls} pcard-btn" data-action="hearts-card" data-card="${cardKey(c)}"
      aria-label="${rk}${SUIT_CHAR[c.s]}">${inner}</button>`:`<div class="${cls}">${inner}</div>`;
  },
  repaint(){
    const st=Windows.state&&Windows.state.hearts;
    if(st&&st.el)st.el.querySelector('.win-body').innerHTML=WINDEF.hearts.body();
  },
  html(){
    const ph=this.phase,active=ph==='play'||ph==='trickEnd';
    const seat=(p,pos)=>`<div class="seat ${pos} ${active&&this.turn===p?'turn':''}">
      <div class="sn"><i></i>${esc(t(SEAT_KEYS[p]))}</div>
      <div class="ss">${this.taken[p]} / ${this.scores[p]} · ${esc(t('hearts.cards',{n:this.hands[p].length}))}</div>
    </div>`;
    const trickPos={0:'tc-s',1:'tc-w',2:'tc-n',3:'tc-e'};
    const trickHTML=this.trick.map(x=>`<div class="tc ${trickPos[x.p]}">${this.cardHTML(x.card,false)}</div>`).join('');
    const legal=(ph==='play'&&this.turn===0)?this.legal(0):null;
    const handHTML=this.hands[0].map(c=>{
      const k=cardKey(c);
      const ok=ph==='pass'?true:(legal?legal.some(x=>x.s===c.s&&x.r===c.r):false);
      return this.cardHTML(c,true,(this.selected.includes(k)?'sel ':'')+(ok?'':'disabled'));
    }).join('');
    const btns=[];
    if(ph==='pass')btns.push(`<button class="btn" data-action="hearts-pass">${icon('send')}<span>${esc(t('hearts.pass'))}</span></button>`);
    if(ph==='play'&&this.turn===0)btns.push(`<button class="btn" data-action="hearts-play">${icon('send')}<span>${esc(t('hearts.play'))}</span></button>`);
    if(ph==='handEnd')btns.push(`<button class="btn" data-action="hearts-next">${icon('chevron')}<span>${esc(t('hearts.next'))}</span></button>`);
    return `<div class="hearts">
      <div class="hearts-bar">
        <span class="pill"><span class="dot"></span>${esc(t('hearts.round',{n:this.round||1}))}</span>
        <span class="tiny muted">${esc(t('hearts.trick',{n:Math.min(this.trickNo+1,13)}))} · ${esc(t('hearts.goal'))}</span>
        <span class="grow"></span>
        <button class="btn ghost" data-action="hearts-rules">${icon('shield')}<span>${esc(t('hearts.rules'))}</span></button>
        <button class="btn ghost" data-action="hearts-new">${icon('restart')}<span>${esc(t('hearts.new'))}</span></button>
        ${btns.join('')}
      </div>
      <div class="hearts-msg ${ph==='gameEnd'?'is-win':''}">${esc(t(this.msg.key,this.msgVars()))}</div>
      <div class="hearts-table">
        ${seat(2,'seat-n')}${seat(1,'seat-w')}
        <div class="hearts-center">${trickHTML||`<span class="hc-label">${esc(t('win.hearts.key'))}</span>`}</div>
        ${seat(3,'seat-e')}${seat(0,'seat-s')}
      </div>
      <div class="hearts-hand">${handHTML||`<span class="tiny muted">—</span>`}</div>
      <div class="hearts-scores">${[0,1,2,3].map(p=>`<div class="hs ${p===0?'me':''}">
        <b>${this.scores[p]}</b><span>${esc(t(SEAT_KEYS[p]))} · ${esc(t('hearts.taken'))} ${this.taken[p]}</span></div>`).join('')}</div>
      ${this.showRules?`<div class="hearts-rules"><b>${esc(t('hearts.rules'))}</b> · ${esc(t('hearts.rules.text'))}</div>`:''}
    </div>`;
  }
};

const Windows={
  state:{},tasks:[false,false,false],z:30,current:null,_n:0,_ignoreClick:false,
  init(){
    Object.entries(WINDEF).forEach(([id,d])=>{
      const w=Math.min(d.w,Math.max(280,innerWidth-28));
      const h=Math.max(210,Math.min(d.h,innerHeight-190));
      const el=document.createElement('section');
      el.className='win glass glass-ctl';el.dataset.wid=id;el.hidden=true;
      el.setAttribute('role','dialog');el.setAttribute('aria-modal','false');
      el.style.width=w+'px';el.style.height=h+'px';
      el.innerHTML=`<div class="win-head"><span class="wk"></span><span class="wt"></span>
        <button class="win-ctl" data-wact="min" aria-label="Minimize">${icon('minus')}</button>
        <button class="win-ctl danger" data-wact="close" aria-label="Close">${icon('close')}</button></div>
        <div class="win-body"></div><div class="win-resize" aria-hidden="true"></div>`;
      $('#win-layer').appendChild(el);
      const st={id,el,w,h,x:0,y:0,open:false,min:false,placed:false};
      this.state[id]=st;this.bindDrag(st);this.bindResize(st);
      el.addEventListener('pointerdown',()=>this.focus(id));
    });
    this.renderAll();
  },
  renderAll(){
    Object.entries(this.state).forEach(([id,st])=>{
      const d=WINDEF[id];
      st.el.setAttribute('aria-label',t('win.'+id+'.title'));
      st.el.querySelector('.wk').textContent=t('win.'+id+'.key');
      st.el.querySelector('.wt').textContent=t('win.'+id+'.title');
      st.el.querySelector('[data-wact="min"]').setAttribute('aria-label',t('common.minimize'));
      st.el.querySelector('[data-wact="close"]').setAttribute('aria-label',t('common.close'));
      st.el.querySelector('.win-body').innerHTML=d.body();
      if(d.mount)d.mount(st);          // 需要持有画布像素的程序在此恢复
    });
    syncControls();Notifications.renderList();AI.refreshView();
  },
  bindDrag(st){
    const head=st.el.querySelector('.win-head');
    head.addEventListener('pointerdown',e=>{
      if(e.target.closest('.win-ctl')||e.button!==0)return;
      this.focus(st.id);
      try{st.el.getAnimations().forEach(a=>a.cancel())}catch(err){}
      e.preventDefault();
      const sx=e.clientX,sy=e.clientY,ox=st.x,oy=st.y;let moved=false;
      try{head.setPointerCapture(e.pointerId)}catch(err){}
      const move=ev=>{
        if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>2)moved=true;
        st.x=clamp(ox+ev.clientX-sx,-st.w*.55,innerWidth-70);
        st.y=clamp(oy+ev.clientY-sy,0,innerHeight-130);
        st.el.style.transform=`translate3d(${st.x}px,${st.y}px,0)`;
      };
      const up=()=>{
        window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
        window.removeEventListener('pointercancel',up);
        // 拖拽松手后浏览器会补发一次 click，必须吞掉，否则会命中全局委托误伤窗口
        if(moved){Windows._ignoreClick=true;setTimeout(()=>{Windows._ignoreClick=false},0)}
      };
      window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
    });
  },
  bindResize(st){
    const h=st.el.querySelector('.win-resize');
    h.addEventListener('pointerdown',e=>{
      e.stopPropagation();e.preventDefault();this.focus(st.id);
      try{h.setPointerCapture(e.pointerId)}catch(err){}
      const sx=e.clientX,sy=e.clientY,ow=st.w,oh=st.h;let moved=false;
      const move=ev=>{
        if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)>2)moved=true;
        st.w=clamp(ow+ev.clientX-sx,290,Math.min(780,innerWidth-16));
        st.h=clamp(oh+ev.clientY-sy,210,Math.min(640,innerHeight-140));
        st.el.style.width=st.w+'px';st.el.style.height=st.h+'px';
      };
      const up=()=>{
        window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up);
        window.removeEventListener('pointercancel',up);
        if(moved){Windows._ignoreClick=true;setTimeout(()=>{Windows._ignoreClick=false},0)}
      };
      window.addEventListener('pointermove',move);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
    });
  },
  open(id){
    const st=this.state[id];if(!st)return;
    if(!st.placed){
      st.w=Math.min(st.w,Math.max(280,innerWidth-24));
      const maxX=Math.max(8,innerWidth-st.w-18);
      const step=this._n%4;                       // 阶梯错开，避免玻璃窗口完全叠在一起
      st.x=clamp(innerWidth*.30+step*58,8,maxX);
      st.y=clamp(innerHeight*.11+step*34,10,Math.max(10,innerHeight-st.h-120));
      st.el.style.width=st.w+'px';st.placed=true;this._n++;
    }
    st.open=true;st.min=false;
    st.el.style.transform=`translate3d(${st.x}px,${st.y}px,0)`;
    const a=Fx.show(st.el,
      {opacity:0,transform:`translate3d(${st.x}px,${st.y+14}px,0) scale(.97)`,clipPath:'inset(46% 46% round 20px)'},
      {opacity:1,transform:`translate3d(${st.x}px,${st.y}px,0)`,clipPath:'inset(0% round 20px)'},250);
    if(a)a.onfinish=()=>{try{a.cancel()}catch(e){}};
    this.focus(id);
  },
  hideWin(st){
    const el=st.el,pos=`translate3d(${st.x}px,${st.y}px,0)`;
    try{el.getAnimations().forEach(a=>a.cancel())}catch(e){}
    const a=motionOn()?el.animate([
      {opacity:1,transform:pos,clipPath:'inset(0% round 20px)'},
      {opacity:0,transform:`translate3d(${st.x}px,${st.y+16}px,0) scale(.97)`,clipPath:'inset(46% 46% round 20px)'}],
      {duration:180,easing:'cubic-bezier(.4,0,.7,1)',fill:'both'}):
      el.animate([{opacity:1},{opacity:0}],{duration:130});
    a.onfinish=()=>{el.hidden=true;try{a.cancel()}catch(e){}};
  },
  close(id){const st=this.state[id];if(!st)return;st.open=false;st.min=false;
    this.hideWin(st);if(this.current===id)this.current=null;this.railSync()},
  minimize(id){const st=this.state[id];if(!st)return;st.min=true;
    this.hideWin(st);if(this.current===id)this.current=null;this.railSync()},
  focus(id){const st=this.state[id];if(!st)return;
    this.current=id;st.el.style.zIndex=++this.z;
    Object.values(this.state).forEach(s=>s.el.classList.toggle('focused',s.id===id));this.railSync()},
  railSync(){
    $$('.rail-btn[data-win]').forEach(b=>{const st=this.state[b.dataset.win];
      b.classList.toggle('running',!!(st&&st.open));
      b.classList.toggle('active',!!(st&&st.open&&!st.min&&this.current===st.id))});
  }
};

/* ---------- 12. 启动器 ---------- */
const Launcher={
  isOpen(){return !$('#launcher').hidden},_lastFocus:null,
  render(){
    const el=$('#launcher');el.setAttribute('aria-label',t('launcher.title'));
    const apps=[['paint','brush','launcher.app.paint'],['hearts','heart','launcher.app.hearts'],
      ['calc','calc','launcher.app.calc'],['notes','note','launcher.app.notes'],
      ['mines','mine','launcher.app.mines'],['today','calendar','launcher.app.today'],
      ['context','spark','launcher.app.context'],['system','monitor','launcher.app.system'],
      ['events','layers','launcher.app.events'],['ambient','palette','launcher.app.ambient'],
      ['control','sliders','launcher.app.control']];
    el.innerHTML=`<div class="panel-head"><h2>${esc(t('launcher.title'))}</h2>
      <span class="pill"><span class="dot"></span>Lumen OS</span></div>
      <div class="field"><span class="ic">${icon('command')}</span>
        <input id="launcher-search" placeholder="${esc(t('launcher.search'))}" aria-label="${esc(t('launcher.search'))}">
        <span class="tiny muted">⌘K</span></div>
      <div class="app-grid" id="app-grid">${apps.map(([id,ic,key])=>
        `<button class="app-tile" data-open="${id}" data-name="${esc(t(key))}">
          <span class="ai">${icon(ic)}</span><span>${esc(t(key))}</span></button>`).join('')}</div>
      <div class="tiny muted" style="margin-top:12px;text-align:center">${esc(LOCALE==='zh'?
        '输入指令并回车，交给副驾执行':'Type a command and press Enter to hand it to the copilot')}</div>`;
  },
  filter(q){q=q.trim().toLowerCase();$$('#app-grid .app-tile').forEach(b=>b.hidden=!!q&&!b.dataset.name.toLowerCase().includes(q))},
  toggle(){this.isOpen()?this.close():this.open()},
  open(){Panels.close(true);this._lastFocus=document.activeElement;
    this.render();
    const el=$('#launcher');el.hidden=false;
    try{el.getAnimations().forEach(a=>a.cancel())}catch(e){}
    const a=motionOn()?el.animate(
      [{opacity:0,clipPath:'inset(46% 46% round 24px)'},{opacity:1,clipPath:'inset(0% round 24px)'}],
      {duration:250,easing:'cubic-bezier(.2,.8,.25,1)',fill:'both'}):
      el.animate([{opacity:0},{opacity:1}],{duration:160});
    a.onfinish=()=>{try{a.cancel()}catch(e){}};
    setTimeout(()=>{const i=$('#launcher-search');i&&i.focus({preventScroll:true})},70);
  },
  close(skipFocus){if(!this.isOpen())return;
    const el=$('#launcher');
    try{el.getAnimations().forEach(a=>a.cancel())}catch(e){}
    const cb=()=>{el.hidden=true;
      if(!skipFocus&&this._lastFocus&&this._lastFocus.focus)this._lastFocus.focus({preventScroll:true})};
    const a=motionOn()?el.animate(
      [{opacity:1,clipPath:'inset(0% round 24px)'},{opacity:0,clipPath:'inset(46% 46% round 24px)'}],
      {duration:180,easing:'cubic-bezier(.4,0,.7,1)',fill:'both'}):
      el.animate([{opacity:1},{opacity:0}],{duration:130});
    a.onfinish=()=>{cb();try{a.cancel()}catch(e){}};
  }
};

/* ---------- 13. AI 副驾状态机 ---------- */
const AI={
  phase:'idle',result:'',resultVarKey:'',canUndo:false,snapshot:null,expire:0,
  set(p){
    this.phase=p;
    const orb=$('#ai-orb'),line=$('#ai-line'),sub=$('#ai-sub');
    const map={idle:['ai.idle','ai.context',false],listening:['ai.listening','ai.context',true],
      thinking:['ai.thinking','ai.context',true],action:['ai.action','ai.context',false]};
    const m=map[p]||map.idle;
    if(line)line.textContent=t(m[0]);if(sub)sub.textContent=t(m[1]);
    if(orb)orb.classList.toggle('pulse',m[2]&&motionOn());
    if(p==='thinking')this.bars();
  },
  bars(){$$('#mini-bars i').forEach(b=>b.style.height=(6+Math.random()*20).toFixed(0)+'px')},
  ask(){
    Windows.open('context');
    setTimeout(()=>{const i=$('[data-ai-input]');i&&i.focus({preventScroll:true})},300);
    if(this.phase==='idle'){this.set('listening');clearTimeout(this._listen);
      this._listen=setTimeout(()=>{if(this.phase==='listening')this.set('idle')},2800)}
  },
  run(text){
    const s=(text||'').trim()||t('card.ai.title');
    clearTimeout(this._listen);this.set('thinking');
    const input=$('[data-ai-input]');if(input)input.value='';
    setTimeout(()=>{
      this.snapshot={...Prefs.get()};
      let key;
      Notifications.silent=true;
      try{key=this.applyIntent(s)}finally{Notifications.silent=false}
      this.resultVarKey=key;
      this.result=t('win.context.result',{x:t(key)});
      this.canUndo=true;this.set('action');
      Notifications.push('spark',t('toast.ai.t'),t('toast.ai.b'));
      this.refreshView();
      clearTimeout(this.expire);this.expire=setTimeout(()=>this.expireUndo(),8000);
    },1050);
  },
  applyIntent(s){
    const v=s.toLowerCase();
    if(/浅色|明亮|light|bright/.test(v)){Theme.set('light',{x:innerWidth*.5,y:innerHeight*.4});return 'theme.light'}
    if(/深色|暗色|dark/.test(v)){Theme.set('dark',{x:innerWidth*.5,y:innerHeight*.4});return 'theme.dark'}
    if(/极光|aurora/.test(v)){Theme.setWallpaper('aurora');return 'wp.aurora'}
    if(/余烬|ember/.test(v)){Theme.setWallpaper('ember');return 'wp.ember'}
    if(/星云|nebula/.test(v)){Theme.setWallpaper('nebula');return 'wp.nebula'}
    const names=['indigo','aurora','ember','orchid'],cur=Prefs.get().accent;
    const n=names.find(x=>x!==cur)||'indigo';Theme.cycleAccent(n);return 'panel.control.accent';
  },
  undo(){
    if(!this.canUndo||!this.snapshot)return;
    const loc=this.snapshot.locale;
    Notifications.silent=true;try{Prefs.patch(this.snapshot)}finally{Notifications.silent=false}
    if(loc!==LOCALE)I18n.set(loc);
    Notifications.push('undo',t('toast.undo.t'),t('toast.undo.b'));
    this.canUndo=false;this.snapshot=null;this.result='';this.resultVarKey='';
    clearTimeout(this.expire);this.set('idle');this.refreshView();
  },
  expireUndo(){this.canUndo=false;this.snapshot=null;this.result='';this.resultVarKey='';
    if(this.phase==='action')this.set('idle');this.refreshView()},
  refreshView(){
    const r=$('#ai-result'),u=$('#ai-undo');
    if(r){r.hidden=!this.result;
      r.textContent=this.result?t('win.context.result',{x:t(this.resultVarKey||'panel.control.accent')}):''}
    if(u)u.disabled=!this.canUndo;
  }
};

/* ---------- 14. 装配与全局事件 ---------- */
const App={
  init(){
    LOCALE=Prefs.get().locale==='en'?'en':'zh';
    document.documentElement.dataset.locale=LOCALE;
    $('#mini-bars').innerHTML=Array.from({length:20},(_,i)=>`<i style="height:${7+((i*7)%19)}px"></i>`).join('');
    Notes.init();Mines.init();Paint.init();Hearts.init();
    Windows.init();
    Wallpaper.init();
    Theme.apply();
    I18n.refresh();
    Clock.start();
    OS.init();
    this.bind();
    try{Theme._mq.addEventListener('change',()=>{if(Prefs.get().theme==='auto')Theme.apply()})}catch(e){}
    Boot.run();
  },
  bind(){
    $('#btn-control').addEventListener('click',()=>Panels.toggle('control'));
    $('#btn-notify').addEventListener('click',()=>Panels.toggle('notify'));
    $('#btn-theme').addEventListener('click',e=>{const eff=Theme.effective();
      Theme.set(eff==='dark'?'light':'dark',{x:e.clientX||innerWidth-60,y:e.clientY||24})});
    $('#btn-lang').addEventListener('click',()=>I18n.set(LOCALE==='zh'?'en':'zh'));
    $('#btn-wifi').addEventListener('click',()=>Notifications.push('wifi',t('status.network'),
      LOCALE==='zh'?'演示固定运行在本地，不发起任何网络请求。':'The demo runs locally; no network requests are made.'));
    $('#btn-battery').addEventListener('click',()=>{const v=$('#battery-val').textContent;
      Notifications.push('battery',t('status.battery'),v==='—'?
        (LOCALE==='zh'?'此环境未提供电量接口，已降级显示为 —':'Battery API unavailable — showing a placeholder.'):v)});
    $('#rail-launcher').addEventListener('click',()=>Launcher.toggle());
    $('#rail-ai').addEventListener('click',()=>AI.ask());
    $('#btn-ask').addEventListener('click',()=>AI.ask());
    $('#btn-wake').addEventListener('click',()=>App.wake());
    $('#b-skip').addEventListener('click',()=>Boot.abort());
    $('#rail-fullscreen').addEventListener('click',async()=>{
      try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();
        else await document.exitFullscreen()}catch(e){}       // 必须由用户激活，失败静默降级
    });
    document.addEventListener('click',e=>{
      if(Windows._ignoreClick){Windows._ignoreClick=false;e.preventDefault();return}
      const el=e.target.closest('[data-action],[data-toggle],[data-theme],[data-accent],[data-wp],[data-locale],[data-open],[data-wact],[data-win],[data-task],[data-note]');
      if(!el)return;const d=el.dataset;
      if(d.action){
        switch(d.action){
          case 'test':Notifications.push('bell',t('toast.test.t'),t('toast.test.b'));break;
          case 'clear':Notifications.clear();break;
          case 'restart':App.restart();break;
          case 'shutdown':App.shutdown();break;
          case 'ai-run':{const i=$('[data-ai-input]');AI.run(i?i.value:'');break}
          case 'ai-undo':AI.undo();break;
          case 'note-x':Notifications.remove(+d.id);break;
          case 'toast-x':Notifications.dismiss(el.closest('.toast'));break;
          case 'calc':Calc.press(d.key);break;
          case 'notes-clear':Notes.clear();break;
          case 'notes-export':Notes.exportTxt();break;
          case 'mines-new':Mines.newGame(Mines.level);break;
          case 'mines-level':Mines.newGame(d.level);break;
          case 'mines-mode':Mines.toggleMode();break;
          case 'mine-cell':Mines.open(+d.cell);break;
          case 'paint-tool':Paint.setTool(d.tool);break;
          case 'paint-color':Paint.setColor(d.color);break;
          case 'paint-undo':Paint.undo();break;
          case 'paint-redo':Paint.redo();break;
          case 'paint-clear':Paint.clear();break;
          case 'paint-export':Paint.exportPNG();break;
          case 'hearts-new':Hearts.newGame();break;
          case 'hearts-next':Hearts.startHand();break;
          case 'hearts-pass':Hearts.confirmPass();break;
          case 'hearts-play':Hearts.userPlay();break;
          case 'hearts-rules':Hearts.showRules=!Hearts.showRules;Hearts.repaint();break;
          case 'hearts-card':Hearts.select(d.card);break;
        }return;
      }
      if(d.toggle){const p=Prefs.get();p[d.toggle]=!p[d.toggle];Prefs.patch({});
        announce(t('panel.control.'+(d.toggle==='motion'?'motion':d.toggle))+' '+(p[d.toggle]?t('common.on'):t('common.off')));return}
      if(d.theme){Theme.set(d.theme,{x:e.clientX,y:e.clientY});return}
      if(d.accent){Theme.cycleAccent(d.accent);return}
      if(d.wp){Theme.setWallpaper(d.wp);return}
      if(d.locale){I18n.set(d.locale);return}
      if(d.open){Launcher.close(true);
        if(d.open==='control')Panels.openPanel('control');else Windows.open(d.open);return}
      if(d.wact){const win=el.closest('.win');if(!win)return;
        if(d.wact==='close')Windows.close(win.dataset.wid);else Windows.minimize(win.dataset.wid);return}
      if(d.win&&el.classList.contains('rail-btn')){const st=Windows.state[d.win];
        if(st&&st.open&&!st.min&&Windows.current===d.win)Windows.minimize(d.win);else Windows.open(d.win);return}
      if(d.task!==undefined){Windows.tasks[+d.task]=!Windows.tasks[+d.task];Windows.renderAll();return}
      if(d.note){Notifications.markOne(+d.note);return}
    });
    document.addEventListener('input',e=>{
      const r=e.target.closest('[data-range]');
      if(r){const v=+r.value;r.style.setProperty('--val',v+'%');Prefs.patch({[r.dataset.range]:v});return}
      if(e.target.id==='launcher-search'){Launcher.filter(e.target.value);return}
      if(e.target.id==='notes-area'){Notes.save(e.target.value);return}
      if(e.target.hasAttribute&&e.target.hasAttribute('data-paint-size')){Paint.setSize(e.target.value);return}
      if(e.target.hasAttribute&&e.target.hasAttribute('data-paint-color')){Paint.setColor(e.target.value);return}
    });
    document.addEventListener('contextmenu',e=>{
      const cell=e.target.closest('[data-action="mine-cell"]');
      if(cell){e.preventDefault();Mines.flag(+cell.dataset.cell)}
    });
    document.addEventListener('keydown',e=>{
      if(e.key==='Escape'){
        if(Boot.active){Boot.abort();return}
        if(Launcher.isOpen()){Launcher.close();return}
        if(Panels.open){Panels.close();return}
        if(e.target&&e.target.classList&&e.target.classList.contains('toast')){Notifications.dismiss(e.target);return}
      }
      if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();Launcher.toggle();return}
      const ps=Windows.state.paint;
      if((e.metaKey||e.ctrlKey)&&ps&&ps.open&&!ps.min&&Windows.current==='paint'
         &&e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){
        const k=e.key.toLowerCase();
        if(k==='z'){e.preventDefault();e.shiftKey?Paint.redo():Paint.undo();return}
        if(k==='y'){e.preventDefault();Paint.redo();return}
      }
      if(e.key==='Enter'){
        if(e.target.id==='launcher-search'){const q=e.target.value.trim();Launcher.close(true);
          if(q){Windows.open('context');AI.run(q)}return}
        if(e.target.matches&&e.target.matches('[data-ai-input]')){AI.run(e.target.value);return}
        if(e.target.matches&&e.target.matches('[data-task]')){e.target.click();return}
      }
      // 计算器窗口聚焦时接管键盘（输入框 / 文本域除外）
      const cs=Windows.state.calc;
      if(cs&&cs.open&&!cs.min&&Windows.current==='calc'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&
         e.target.tagName!=='INPUT'&&e.target.tagName!=='TEXTAREA'){
        const map={'x':'*','X':'*','×':'*','÷':'/','−':'-','Enter':'=','Backspace':'⌫','c':'AC','C':'AC'};
        const k=map[e.key]!==undefined?map[e.key]:e.key;
        if(/^[0-9+\-*\/().%]$/.test(k)||k==='='||k==='⌫'||k==='AC'){
          e.preventDefault();Calc.press(k);return;
        }
      }
      if((e.key==='ArrowDown'||e.key==='ArrowUp')&&e.target.matches&&e.target.matches('.note')){
        e.preventDefault();const list=$$('.note',e.target.parentElement),i=list.indexOf(e.target);
        const n=list[i+(e.key==='ArrowDown'?1:-1)];if(n)n.focus();return;
      }
      if(Boot.active&&e.key.length===1)Boot.abort();
    });
    document.addEventListener('pointerdown',e=>{
      if(Panels.open&&!e.target.closest('.panel')&&!e.target.closest('#btn-control')&&!e.target.closest('#btn-notify'))Panels.close();
      if(Launcher.isOpen()&&!e.target.closest('#launcher')&&!e.target.closest('#rail-launcher'))Launcher.close(true);
      Paint.start(e);                        // 只处理命中画布的指针
    });
    document.addEventListener('pointermove',e=>Paint.move(e));
    const paintEnd=e=>Paint.end(e);
    document.addEventListener('pointerup',paintEnd);
    document.addEventListener('pointercancel',paintEnd);
    addEventListener('blur',()=>Paint.end({}));
    addEventListener('resize',()=>Paint.refresh());
    document.addEventListener('visibilitychange',()=>{
      if(!document.hidden&&Hearts.phase==='play'&&Hearts.turn!==0)Hearts.schedule();
    });
  },
  restart(){Panels.close(true);Launcher.close(true);
    Notifications.push('restart',t('toast.restart.t'),t('toast.restart.b'));
    setTimeout(()=>Boot.run(),260)},
  shutdown(){Panels.close(true);Launcher.close(true);
    const d=$('#desktop');
    if(motionOn())d.animate([{opacity:1,filter:'blur(0px)'},{opacity:0,filter:'blur(8px)'}],
      {duration:300,easing:'cubic-bezier(.4,0,.7,1)',fill:'forwards'});
    setTimeout(()=>{$('#shutdown').hidden=false;Clock.stop()},320)},
  wake(){$('#shutdown').hidden=true;
    try{$('#desktop').getAnimations().forEach(a=>a.cancel())}catch(e){}
    $('#desktop').style.opacity='';Clock.start();Boot.run()}
};

App.init();
</script>
