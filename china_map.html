<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国地图交互</title>
<style>
  :root {
    --bg:#070b16; --panel-bg:rgba(10,15,28,.92); --panel-border:#24344e;
    --text:#dde6f4; --text-dim:#8a9ab0; --accent:#7fe9ff;
    --province-fill:#172238; --province-stroke:#3a5a82; --province-hover:#2a3f5f;
    --pname-fill:#e8eef7; --capital-fill:#ffd93d; --cname-fill:#7fe9ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:"PingFang SC","Microsoft YaHei","WenQuanYi Micro Hei",sans-serif;transition:background .3s;}
  #mapWrap{position:fixed;inset:0;cursor:grab;touch-action:none;}
  #mapWrap.dragging{cursor:grabbing;}
  svg{width:100%;height:100%;display:block;}
  .province{stroke-linejoin:round;cursor:pointer;transition:fill .15s, stroke .15s;}
  /* 省份名 / 省会名：围绕文字自身中心做弹入式缩放 */
  .pname,.cname{
    transform-box:fill-box;transform-origin:center center;
    transition:fill .15s, transform .3s cubic-bezier(.34,1.56,.64,1);
  }
  .pname{text-anchor:middle;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.55);stroke-width:0.05;stroke-linejoin:round;}
  .cname{text-anchor:start;dominant-baseline:central;pointer-events:none;paint-order:stroke;stroke:rgba(0,0,0,.6);stroke-width:0.04;stroke-linejoin:round;}
  .pname.is-pop,.cname.is-pop{transform:scale(1.32);font-weight:700;}
  .capital{cursor:pointer;transition:fill .15s, r .25s ease;}
  .geo{pointer-events:none;}
  .geo-hit{pointer-events:stroke;cursor:pointer;}
  /* 水系/山脉名称：默认缩小淡出，显示时弹入，悬停/高亮时再放大一档 */
  .geo-label{
    pointer-events:none;
    transform-box:fill-box;transform-origin:center center;
    opacity:0;transform:scale(.55);
    transition:opacity .2s ease, transform .32s cubic-bezier(.34,1.56,.64,1), fill .15s;
  }
  .geo-label.is-on{opacity:1;transform:scale(1);}
  .geo-label.is-on.is-pop{transform:scale(1.3);font-weight:700;stroke:rgba(0,0,0,.82);stroke-width:0.03;}
  #glowStop{display:none;}

  #panel{position:fixed;top:12px;right:12px;z-index:10;width:250px;max-height:calc(100% - 24px);overflow-y:auto;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:12px;padding:13px 14px 15px;color:var(--text);box-shadow:0 10px 40px rgba(0,0,0,.55);backdrop-filter:blur(8px);}
  #panel h3{font-size:13px;margin-bottom:9px;color:var(--accent);letter-spacing:1px;}
  #panel .row{margin-bottom:10px;}
  #panel label{display:flex;justify-content:space-between;font-size:11px;color:var(--text-dim);margin-bottom:3px;}
  #panel label b{color:var(--text);font-weight:600;}
  #panel input[type=range]{width:100%;accent-color:var(--accent);height:4px;}
  #panel .chk{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--text);cursor:pointer;}
  #panel .chk input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;}
  #panel .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:11px;}
  #panel button{background:rgba(255,255,255,.08);color:var(--text);border:1px solid var(--panel-border);border-radius:7px;padding:7px 0;font-size:11px;cursor:pointer;transition:.2s;}
  #panel button:hover{background:rgba(255,255,255,.15);border-color:var(--accent);}
  #panel .sep{border-top:1px solid var(--panel-border);margin:9px 0 6px;}
  #panel .hint{font-size:10px;color:var(--text-dim);margin-top:9px;line-height:1.6;}
  #panel::-webkit-scrollbar{width:5px;}
  #panel::-webkit-scrollbar-thumb{background:var(--panel-border);border-radius:3px;}

  .zoomBtns{position:fixed;left:12px;bottom:12px;z-index:10;display:flex;flex-direction:column;gap:6px;}
  .zoomBtns button{width:38px;height:38px;border-radius:9px;border:1px solid var(--panel-border);background:var(--panel-bg);color:var(--accent);font-size:20px;cursor:pointer;line-height:1;}
  .zoomBtns button:hover{background:rgba(255,255,255,.1);}

  #legend{position:fixed;left:12px;bottom:70px;z-index:10;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:12px;padding:10px 12px;color:var(--text);font-size:11px;backdrop-filter:blur(8px);box-shadow:0 8px 30px rgba(0,0,0,.45);}
  #legend .lg-title{font-size:11px;color:var(--accent);letter-spacing:1px;margin-bottom:7px;font-weight:600;}
  #legend .chk{display:flex;align-items:center;gap:7px;margin-bottom:5px;cursor:pointer;color:var(--text-dim);}
  #legend .chk input{accent-color:var(--accent);width:13px;height:13px;cursor:pointer;}
  #legend .chk:has(input:checked){color:var(--text);}
  #legend .sw{width:22px;height:0;border-top-width:3px;border-top-style:solid;border-radius:2px;flex:none;}
  #legend .sw-river{border-top-color:#38bdf8;}
  #legend .sw-mtn{border-top-color:#94a3b8;border-top-style:dashed;}
  #legend .sw-label{border-top-color:transparent;background:var(--text-dim);height:2px;width:22px;border-radius:1px;}
  #legend .lg-tip{margin-top:6px;font-size:9.5px;color:var(--text-dim);line-height:1.5;}

  #status{position:fixed;left:12px;top:12px;z-index:10;font-size:12px;color:var(--accent);background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:8px;padding:7px 12px;pointer-events:none;}

  #themeBar{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:10;display:flex;gap:6px;padding:6px 10px;background:var(--panel-bg);border:1px solid var(--panel-border);border-radius:20px;backdrop-filter:blur(8px);}
  #themeBar button{padding:5px 14px;border-radius:14px;border:none;cursor:pointer;font-size:12px;color:var(--text-dim);background:transparent;transition:.2s;}
  #themeBar button.active{background:var(--accent);color:#000;font-weight:600;}
  #themeBar button:hover{color:var(--text);}
</style>
</head>
<body>

<div id="mapWrap">
  <svg id="map" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
        <feGaussianBlur stdDeviation="0.2" result="coloredBlur"/>
        <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>
    </defs>
    <g id="viewport"></g>
  </svg>
</div>

<div id="themeBar">
  <button data-theme="dark" class="active">🌙 暗黑</button>
  <button data-theme="light">☀️ 明亮</button>
  <button data-theme="sky">🌌 天空</button>
  <button data-theme="nature">🌿 自然</button>
</div>

<div id="status">就绪 · 点击省份高亮</div>

<div id="legend">
  <div class="lg-title">图例</div>
  <label class="chk"><input type="checkbox" id="lgRivers" checked><span class="sw sw-river"></span>水系（河流）</label>
  <label class="chk"><input type="checkbox" id="lgMtns" checked><span class="sw sw-mtn"></span>山脉</label>
  <label class="chk"><input type="checkbox" id="lgGeoLabel"><span class="sw sw-label"></span>水系/山脉名称</label>
  <div class="lg-tip">点击可高亮 · 悬停显示名称</div>
</div>

<div id="panel">
  <h3>⚙ 地图设置</h3>
  <div class="row"><label>省线粗细 <b id="vStroke">0.05</b></label><input type="range" id="setStroke" min="0.01" max="0.2" step="0.01" value="0.05"></div>
  <div class="row"><label>高亮省线粗细 <b id="vHLStroke">0.16</b></label><input type="range" id="setHLStroke" min="0.05" max="0.5" step="0.01" value="0.16"></div>
  <div class="row"><label>省份名字号 <b id="vName">0.28</b></label><input type="range" id="setName" min="0.1" max="0.7" step="0.02" value="0.28"></div>
  <div class="row"><label>省会名字号 <b id="vCName">0.18</b></label><input type="range" id="setCName" min="0.06" max="0.5" step="0.01" value="0.18"></div>
  <div class="row"><label>省会圆点大小 <b id="vDot">0.11</b></label><input type="range" id="setDot" min="0.04" max="0.35" step="0.01" value="0.11"></div>
  <div class="row"><label>省份名透明度 <b id="vNameOp">1.00</b></label><input type="range" id="setNameOp" min="0.3" max="1" step="0.05" value="1"></div>
  <div class="row"><label class="chk"><input type="checkbox" id="setCapitals" checked>显示省会城市</label></div>
  <div class="row"><label class="chk"><input type="checkbox" id="setLabels" checked>显示省份名称</label></div>
  <div class="row"><label class="chk"><input type="checkbox" id="setShadow" checked>高亮发光效果</label></div>
  <div class="sep"></div>
  <div class="row"><label>水系线宽 <b id="vRiver">0.10</b></label><input type="range" id="setRiver" min="0.04" max="0.5" step="0.02" value="0.10"></div>
  <div class="row"><label>山脉线宽 <b id="vMtn">0.14</b></label><input type="range" id="setMtn" min="0.04" max="0.6" step="0.02" value="0.14"></div>
  <div class="row"><label>山川名称字号 <b id="vGeoName">0.42</b></label><input type="range" id="setGeoName" min="0.2" max="0.9" step="0.02" value="0.42"></div>
  <div class="btns">
    <button id="btnOne">🎲 随机一个</button>
    <button id="btnAll">🎲 随机全部</button>
    <button id="btnClear">✕ 清除高亮</button>
    <button id="btnReset">↺ 恢复默认</button>
  </div>
  <div class="hint">快捷键：+ − 缩放 · 0 复位 · Esc 清除<br>滚轮以光标为中心缩放 · 拖拽平移 · 触摸板双指缩放<br>点击省份高亮，再点击恢复</div>
</div>

<div class="zoomBtns">
  <button id="zIn" title="放大">＋</button>
  <button id="zOut" title="缩小">−</button>
  <button id="zReset" title="复位">◎</button>
</div>

function makeEl(tag, attrs) {
  const e = document.createElementNS(SVGNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}

/* 经纬度 -> SVG 坐标（纬度取负，使北在上） */
function project(lon, lat) { return [lon, -lat]; }

/* 折线中心点，用于放置名称标签 */
function centerOf(pts) {
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  pts.forEach(p => {
    const xy = project(p[0], p[1]);
    if (xy[0] < minX) minX = xy[0];
    if (xy[0] > maxX) maxX = xy[0];
    if (xy[1] < minY) minY = xy[1];
    if (xy[1] > maxY) maxY = xy[1];
  });
  return [(minX + maxX) / 2, (minY + maxY) / 2];
}

/* ---------- 计算包围盒 ---------- */

    });
  });
});
const xs = allPts.map(p => p[0]), ys = allPts.map(p => p[1]);
const pad = 1.5;
const VB = [
  Math.min.apply(null, xs) - pad,
  Math.min.apply(null, ys) - pad,
  Math.max.apply(null, xs) - Math.min.apply(null, xs) + pad * 2,
  Math.max.apply(null, ys) - Math.min.apply(null, ys) + pad * 2
];
svgEl.setAttribute("viewBox", VB.join(" "));
svgEl.setAttribute("preserveAspectRatio", "xMidYMid meet");

/* ---------- 水系与山脉图层 ---------- */

}

/* ---------- 高亮核心逻辑 ---------- */
function randColor() {
  const h = Math.floor(Math.random() * 360);
  const s = 70 + Math.floor(Math.random() * 25);
  const l = 52 + Math.floor(Math.random() * 18);
  return "hsl(" + h + "," + s + "%," + l + "%)";
}
/* 获取当前主题下的省份默认填充色 */
function provFillFor(name) {
  return (currentTheme && currentTheme.provFill) ? currentTheme.provFill : THEMES.dark.provFill;
}

/* 名称缩放动画：该省「已点击高亮」或「正在悬停」时，省名/省会名放大 */
function syncProvNameFX(name) {
  const e = elsByName[name];
  if (!e) return;
  const pop = !!hlState[name] || (hoverName === name && !hoverKind);
  if (e.pname) e.pname.classList.toggle("is-pop", pop);
  if (e.cname) e.cname.classList.toggle("is-pop", pop);
}

/* 高亮状态变更后重算悬停态：
   鼠标仍停在刚被"取消高亮"的要素上时，clearHL/clearGeoHL 会把线条复原，
   但名称可能还处于放大态；这里补一次悬停样式，保证线、色、名称三者一致。 */
function refreshHover() {
  if (!hoverName) return;
  const n = hoverName, k = hoverKind;
  if (k === "river" || k === "mountain") {
    if (!geoHL[geoKey(k, n)]) applyHover(n, k);
  } else {
    if (!hlState[n]) applyHover(n);
  }
}

function applyHL(name, color) {
  const e = elsByName[name];
  if (!e || !e.path) return;
  e.path.style.fill = color;
  e.path.style.stroke = color;
  e.path.style.strokeWidth = String(hlStroke);
  e.path.style.fillOpacity = "0.42";
  if (showGlow) e.path.setAttribute("filter", "url(#glow)");
  if (e.pname) { e.pname.style.fill = "#ffffff"; e.pname.style.fillOpacity = "1"; e.pname.style.fontWeight = "bold"; }
  if (e.capital) e.capital.style.fill = "#ffffff";
  if (e.cname) e.cname.style.fill = "#ffffff";
  syncProvNameFX(name);
}
function clearHL(name) {
  const e = elsByName[name];
  if (!e || !e.path) return;
  /* 恢复为当前主题色，而非保存的旧值，避免跨主题残留 */
  e.path.style.fill = provFillFor(name);
  e.path.setAttribute("fill", provFillFor(name));
  e.path.style.stroke = "";
  e.path.style.strokeWidth = "";
  e.path.style.fillOpacity = "";
  e.path.removeAttribute("filter");
  if (e.pname) { e.pname.style.fill = currentTheme ? currentTheme.pName : ""; e.pname.style.fillOpacity = ""; e.pname.style.fontWeight = ""; }
  if (e.capital) e.capital.style.fill = currentTheme ? currentTheme.capFill : "";
  if (e.cname) e.cname.style.fill = currentTheme ? currentTheme.cName : "";
  syncProvNameFX(name);
}
function toggleHL(name) {
  if (!elsByName[name]) return;
  if (hlState[name]) { delete hlState[name]; clearHL(name); }
  else { hlState[name] = randColor(); applyHL(name, hlState[name]); }
  refreshHover();
  updateStatus();
}

/* ---------- 水系 / 山脉 高亮逻辑（与省份相同：点击高亮、再点击恢复）---------- */
function geoKey(kind, name){ return kind + "::" + name; }

/* 该要素是否处于「活跃」状态：已点击高亮 或 正在悬停 */
function geoActive(kind, name) {
  return !!geoHL[geoKey(kind, name)] || (hoverName === name && hoverKind === kind);
}

function applyGeoHL(kind, name, color) {
  const e = geoEls[kind === "river" ? "rivers" : "mountains"][name];
  if (!e || !e.line) return;
  const t = currentTheme || THEMES.dark;
  const base = kind === "river" ? t.river : t.mtn;
  e.line.style.stroke = color;
  e.line.style.strokeWidth = (kind === "river" ? 0.30 : 0.36);
  e.line.style.opacity = "1";
  if (showGlow) e.line.setAttribute("filter", "url(#glow)");
  if (e.label) {
    e.label.style.fill = color;
    e.label.style.fontWeight = "bold";
  }
  geoHL[geoKey(kind, name)] = { color: color, base: base };
  applyGeoVisuals();
}
function clearGeoHL(kind, name) {
  const e = geoEls[kind === "river" ? "rivers" : "mountains"][name];
  if (!e || !e.line) return;
  const t = currentTheme || THEMES.dark;
  const base = kind === "river" ? t.river : t.mtn;
  e.line.style.stroke = "";
  e.line.style.strokeWidth = "";
  e.line.style.opacity = "";
  e.line.removeAttribute("filter");
  if (e.label) {
    e.label.style.fill = (kind === "river" ? t.geoLabel : base);
    e.label.style.fontWeight = "";
    e.label.style.fontSize = "";
  }
  delete geoHL[geoKey(kind, name)];
  applyGeoVisuals();
}
function toggleGeoHL(kind, name) {
  const key = geoKey(kind, name);
  if (geoHL[key]) { clearGeoHL(kind, name); }
  else { applyGeoHL(kind, name, randColor()); }
  refreshHover();
  updateStatus();
}

function isAlreadyHL(name) { return !!hlState[name]; }
function isAlreadyGeoHL(kind, name) { return !!geoHL[geoKey(kind, name)]; }

function applyHover(name, kind) {
  if (kind === "river" || kind === "mountain") {
    const e = geoEls[kind === "river" ? "rivers" : "mountains"][name];
    if (!e || !e.line || isAlreadyGeoHL(kind, name)) return;
    const hl = kind === "river" ? "#ff5e7e" : "#ffb84d";
    e.line.style.stroke = hl;
    e.line.style.strokeWidth = (kind === "river" ? 0.26 : 0.30);
    e.line.style.opacity = "1";
    /* 白色 = 临时悬停；随机彩色 = 已点击高亮，两种状态一眼可分 */
    if (e.label) e.label.style.fill = "#ffffff";
    applyGeoVisuals();                       /* 悬停时临时显示名称，无需打开标签开关 */
    return;
  }
  const e = elsByName[name];
  if (!e || !e.path) return;
  if (isAlreadyHL(name)) return;            /* 已高亮的省不再做悬停效果 */
  e.path.style.fill = "#ffc832";           /* 暖黄半透明填充 */
  e.path.style.fillOpacity = "0.45";
  e.path.style.stroke = "#ff9500";         /* 亮橙省线 */
  e.path.style.strokeWidth = String(hlStroke * 0.8);
  if (e.pname) { e.pname.style.fill = "#ffffff"; e.pname.style.fillOpacity = "1"; }
  syncProvNameFX(name);                    /* 省名 + 省会名弹入放大 */
}

function clearHover(name, kind) {
  if (!name) return;
  if (kind === "river" || kind === "mountain") {
    if (isAlreadyGeoHL(kind, name)) { applyGeoHL(kind, name, geoHL[geoKey(kind, name)].color); return; }
    const e = geoEls[kind === "river" ? "rivers" : "mountains"][name];
    if (!e || !e.line) return;
    const t = currentTheme || THEMES.dark;
    const base = kind === "river" ? t.river : t.mtn;
    e.line.style.stroke = "";
    e.line.style.strokeWidth = "";
    e.line.style.opacity = "";
    if (e.label) e.label.style.fill = (kind === "river" ? t.geoLabel : base);
    applyGeoVisuals();
    return;
  }
  if (isAlreadyHL(name)) {                  /* 若已高亮则还原为高亮样式 */
    applyHL(name, hlState[name]);           /* applyHL 内部已同步名称状态 */
    return;
  }
  const e = elsByName[name];
  if (!e || !e.path) return;
  /* 恢复为当前主题色，而非留空依赖 CSS（内联 style 优先级更高，留空才生效） */
  e.path.style.fill = provFillFor(name);
  e.path.setAttribute("fill", provFillFor(name));
  e.path.style.stroke = "";
  e.path.style.strokeWidth = "";
  e.path.style.fillOpacity = "";
  if (e.pname) { e.pname.style.fill = currentTheme ? currentTheme.pName : ""; e.pname.style.fillOpacity = ""; }
  syncProvNameFX(name);
}

function setHover(name, kind) {
  if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
  const tName = name, tKind = kind;
  hoverTimer = setTimeout(function () {
    if (hoverName && (hoverName !== tName || hoverKind !== tKind)) clearHover(hoverName, hoverKind);
    if (tName && (tName !== hoverName || tKind !== hoverKind)) {
      hoverName = tName; hoverKind = tKind;
      applyHover(tName, tKind);
    }
    hoverTimer = null;
  }, HOVER_DELAY);
}

function endHover() {
  if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
  if (hoverName) {
    const prev = hoverName, pk = hoverKind;
    hoverName = null; hoverKind = null;
    clearHover(prev, pk);
  }
}

/* 绑定悬停事件：mouseenter / mouseleave */
Object.keys(elsByName).forEach(function (name) {
  const e = elsByName[name];
  const enter = function () { setHover(name); };
  if (e.path) { e.path.addEventListener("mouseenter", enter); e.path.addEventListener("mouseleave", endHover); }
  if (e.capital) { e.capital.addEventListener("mouseenter", enter); e.capital.addEventListener("mouseleave", endHover); }
  if (e.cname) { e.cname.addEventListener("mouseenter", enter); e.cname.addEventListener("mouseleave", endHover); }
  if (e.pname) { e.pname.addEventListener("mouseenter", enter); e.pname.addEventListener("mouseleave", endHover); }
});

/* 每个省元素直接绑定点击 */
Object.keys(elsByName).forEach(name => {
  const e = elsByName[name];
  const fire = function (ev) {
    ev.stopPropagation();
    if (isPointerMoving) return;   /* 区分点击与拖拽 */
    toggleHL(name);
  };
  e.path.addEventListener("click", fire);
  if (e.capital) e.capital.addEventListener("click", fire);
  if (e.cname) e.cname.addEventListener("click", fire);
  if (e.pname) e.pname.addEventListener("click", fire);
});

/* 水系 / 山脉 绑定悬停与点击 */
function bindGeo(kind, coll) {
  Object.keys(coll).forEach(name => {
    const e = coll[name];
    if (!e || !e.line) return;
    const enter = function () { setHover(name, kind); };
    const click = function (ev) {
      ev.stopPropagation();
      if (isPointerMoving) return;
      toggleGeoHL(kind, name);
    };
    [e.line, e.hit].filter(Boolean).forEach(function (t) {
      t.addEventListener("mouseenter", enter);
      t.addEventListener("mouseleave", endHover);
      t.addEventListener("click", click);
    });
    if (e.label) {
      e.label.addEventListener("mouseenter", enter);
      e.label.addEventListener("mouseleave", endHover);
      e.label.addEventListener("click", click);
    }
  });
}
bindGeo("river", geoEls.rivers);
bindGeo("mountain", geoEls.mountains);

/* ---------- 主题 ---------- */
let currentTheme = THEMES.dark;
function applyTheme(name) {
  const t = THEMES[name];
  if (!t) return;
  currentTheme = t;
  /* 主题切换时清除悬停，避免悬停态与主题色冲突 */
  if (hoverName) {
    const hn = hoverName, hk = hoverKind;
    hoverName = null; hoverKind = null;
    clearHover(hn, hk);
  }
  if (hoverTimer) { clearTimeout(hoverTimer); hoverTimer = null; }
  const root = document.documentElement;
  const set = {
    "--bg": t.bg, "--panel-bg": t.panelBg, "--panel-border": t.panelBorder,
    "--text": t.text, "--text-dim": t.textDim, "--accent": t.accent,
    "--province-fill": t.provFill, "--province-stroke": t.provStroke,
    "--pname-fill": t.pName, "--capital-fill": t.capFill, "--cname-fill": t.cName
  };
  for (const k in set) root.style.setProperty(k, set[k]);
  document.body.style.background = t.bg;
  document.querySelectorAll("#themeBar button").forEach(b => {
    b.classList.toggle("active", b.dataset.theme === name);
  });
  /* 对每个省做完整重绘：先清掉所有内联样式，再按当前状态重新赋值 */
  Object.keys(elsByName).forEach(nm => {
    const e = elsByName[nm];
    /* 清空所有可能影响颜色的内联样式，避免跨主题残留 */
    e.path.style.fill = "";
    e.path.style.stroke = "";
    e.path.style.strokeWidth = "";
    e.path.style.fillOpacity = "";
    e.path.removeAttribute("filter");
    if (e.pname) { e.pname.style.fill = ""; e.pname.style.fillOpacity = ""; e.pname.style.fontWeight = ""; }
    if (e.capital) e.capital.style.fill = "";
    if (e.cname) e.cname.style.fill = "";
    /* 按当前状态重新赋值 */
    if (hlState[nm]) {
      applyHL(nm, hlState[nm]);             /* 高亮省：保留高亮色 */
    } else {
      e.path.setAttribute("fill", t.provFill);   /* 普通省：当前主题填充色 */
      e.path.setAttribute("stroke", t.provStroke);
      e.path.setAttribute("stroke-width", String(baseStroke));
    }
    if (e.pname) e.pname.setAttribute("fill", t.pName);
    if (e.capital) { e.capital.setAttribute("fill", t.capFill); e.capital.setAttribute("stroke", t.bg); }
    if (e.cname) e.cname.setAttribute("fill", t.cName);
  });
  /* 水系 / 山脉按当前主题重绘 */
  Object.keys(geoEls.rivers).forEach(nm => {
    const e = geoEls.rivers[nm];
    if (geoHL[geoKey("river", nm)]) applyGeoHL("river", nm, geoHL[geoKey("river", nm)].color);
    else {
      e.line.setAttribute("stroke", t.river);
      e.line.setAttribute("stroke-width", String(riverWidth));
      e.line.style.opacity = "0.9";
      /* 必须清掉内联 fill：clearGeoHL 留下的旧主题色会盖住 attribute */
      if (e.label) { e.label.style.fill = ""; e.label.setAttribute("fill", t.geoLabel); }
    }
  });
  Object.keys(geoEls.mountains).forEach(nm => {
    const e = geoEls.mountains[nm];
    if (geoHL[geoKey("mountain", nm)]) applyGeoHL("mountain", nm, geoHL[geoKey("mountain", nm)].color);
    else {
      e.line.setAttribute("stroke", t.mtn);
      e.line.setAttribute("stroke-width", String(mtnWidth));
      e.line.style.opacity = "0.85";
      if (e.label) { e.label.style.fill = ""; e.label.setAttribute("fill", t.mtn); }
    }
  });
  applyGeoVisuals();
  /* 主题重绘后统一校正所有省份名称的缩放状态 */
  Object.keys(elsByName).forEach(nm => syncProvNameFX(nm));
  const blur = document.querySelector("#glow feGaussianBlur");
  if (blur) blur.setAttribute("stdDeviation", t.glow);
}

/* ---------- 设置项 ---------- */
function safeNum(raw, def) {
  const n = parseFloat(raw);
  return (n === n && n !== undefined && n !== null && raw !== "" && raw !== null) ? n : def;  /* 过滤 NaN / undefined */
}
function applyVisuals() {
  Object.keys(elsByName).forEach(nm => {
    const e = elsByName[nm];
    if (!hlState[nm]) {
      e.path.setAttribute("stroke-width", String(baseStroke));
      e.path.style.strokeWidth = String(baseStroke);
    } else {
      e.path.style.strokeWidth = String(hlStroke);
    }
    if (e.pname) {
      e.pname.setAttribute("font-size", String(nameSize));
      e.pname.style.fillOpacity = String(nameOpacity);
      e.pname.style.display = showLabels ? "" : "none";
    }
    if (e.capital) {
      e.capital.setAttribute("r", String(dotSize));
      e.capital.style.display = showCapitals ? "" : "none";
    }
    if (e.cname) {
      const cap = CAPITALS[nm];
      if (cap) {
        const xy = project(cap[0], cap[1]);
        e.cname.setAttribute("font-size", String(cnameSize));
        e.cname.setAttribute("x", String(xy[0] + dotSize * 2.6));
        e.cname.setAttribute("y", String(xy[1] - dotSize * 2.0));
      }
      e.cname.style.display = showCapitals ? "" : "none";
    }
    if (hlState[nm]) {
      if (showGlow) e.path.setAttribute("filter", "url(#glow)");
      else e.path.removeAttribute("filter");
    }
  });
  /* 发光开关同样作用于已高亮的水系 / 山脉 */
  [["river", geoEls.rivers], ["mountain", geoEls.mountains]].forEach(function (g) {
    Object.keys(g[1]).forEach(function (nm) {
      const line = g[1][nm].line;
      if (!line) return;
      if (geoHL[geoKey(g[0], nm)] && showGlow) line.setAttribute("filter", "url(#glow)");
      else line.removeAttribute("filter");
    });
  });
}
function bindRange(id, valId, fn, fmt) {
  const el = document.getElementById(id);
  const out = document.getElementById(valId);
  if (!el) return;
  /* 初始值优先取 defaultValue（HTML 中写死的安全值），避免 DOM 未就绪时读到 undefined */
  const init = (el.defaultValue !== undefined && el.defaultValue !== "") ? parseFloat(el.defaultValue) : 0.1;
  fn(init);
  if (out) out.textContent = fmt ? fmt(init) : String(init);
  const change = function () {
    const v = parseFloat(el.value);
    const num = isNaN(v) ? init : v;
    fn(num);
    if (out) out.textContent = fmt ? fmt(num) : String(num);
    applyVisuals();
  };
  el.addEventListener("input", change);
}
function applyGeoVisuals() {
  const groups = [
    ["river",     geoEls.rivers,     showRivers, riverWidth],
    ["mountain",  geoEls.mountains,  showMtns,   mtnWidth]
  ];
  groups.forEach(function (g) {
    const kind = g[0], coll = g[1], visible = g[2], width = g[3];
    Object.keys(coll).forEach(function (nm) {
      const e = coll[nm];
      const active = geoActive(kind, nm);
      e.line.style.display = visible ? "" : "none";
      if (e.hit) e.hit.style.display = visible ? "" : "none";
      if (e.label) {
        /* 图层开关关闭时硬隐藏；否则用 class 控制淡入 + 缩放动画，而非 display 切换
           （display:none 会跳过 transition，动画就看不见了） */
        e.label.style.display = visible ? "" : "none";
        e.label.style.opacity = "";        /* 清掉内联 opacity，交给 CSS class */
        e.label.setAttribute("font-size", String(geoNameSize));
        const on = showGeoLabels || active;
        e.label.classList.toggle("is-on", on);
        e.label.classList.toggle("is-pop", active);   /* 悬停/高亮时再放大一档 */
      }
      /* 未点击高亮的要素使用滑块线宽；高亮要素由 applyGeoHL 的内联样式接管 */
      if (!geoHL[geoKey(kind, nm)]) e.line.setAttribute("stroke-width", String(width));
    });
  });
}
function bindCheck(id, fn) {
  const el = document.getElementById(id);
  if (!el) return;
  const fire = () => { fn(el.checked); applyVisuals(); applyGeoVisuals(); };
  fire();
  el.addEventListener("change", fire);
}
bindRange("setStroke",  "vStroke",  v => { baseStroke = v; }, v => v.toFixed(2));
bindRange("setHLStroke", "vHLStroke", v => { hlStroke = v; }, v => v.toFixed(2));
bindRange("setName",    "vName",    v => { nameSize = v; }, v => v.toFixed(2));
bindRange("setCName",   "vCName",   v => { cnameSize = v; }, v => v.toFixed(2));
bindRange("setDot",     "vDot",     v => { dotSize = v; }, v => v.toFixed(2));
bindRange("setNameOp",  "vNameOp",  v => { nameOpacity = v; }, v => v.toFixed(2));
bindCheck("setCapitals", v => { showCapitals = v; });
bindCheck("setLabels",  v => { showLabels = v; });
bindCheck("setShadow",  v => { showGlow = v; });
bindRange("setRiver", "vRiver", v => { riverWidth = v; applyGeoVisuals(); }, v => v.toFixed(2));
bindRange("setMtn",   "vMtn",   v => { mtnWidth = v; applyGeoVisuals(); }, v => v.toFixed(2));
bindRange("setGeoName", "vGeoName", v => { geoNameSize = v; applyGeoVisuals(); }, v => v.toFixed(2));
bindCheck("lgRivers",   v => { showRivers = v; applyGeoVisuals(); });
bindCheck("lgMtns",    v => { showMtns = v; applyGeoVisuals(); });
bindCheck("lgGeoLabel", v => { showGeoLabels = v; applyGeoVisuals(); });

document.querySelectorAll("#themeBar button").forEach(btn => {
  btn.addEventListener("click", () => applyTheme(btn.dataset.theme));
});

/* ---------- 缩放与平移 ---------- */
let scale = 1, tx = 0, ty = 0;
const MIN_S = 0.5, MAX_S = 12;
function applyTransform() {
  viewport.setAttribute("transform", "translate(" + tx + "," + ty + ") scale(" + scale + ")");
}
function zoomAt(fx, fy, factor) {
  const ns = Math.min(MAX_S, Math.max(MIN_S, scale * factor));
  if (ns === scale) return;
  tx = fx - (fx - tx) * (ns / scale);
  ty = fy - (fy - ty) * (ns / scale);
  scale = ns;
  applyTransform();
}
/* 屏幕坐标 -> SVG 根坐标（viewBox 坐标系），自动适配 preserveAspectRatio 的留白 */
function clientToSvg(cx, cy) {
  const r = svgEl.getBoundingClientRect();
  if (svgEl.createSVGPoint && svgEl.getScreenCTM) {
    const m = svgEl.getScreenCTM();
    if (m) {
      const pt = svgEl.createSVGPoint();
      pt.x = cx; pt.y = cy;
      const q = pt.matrixTransform(m.inverse());
      return [q.x, q.y];
    }
  }
  return [(cx - r.left) / r.width * VB[2] + VB[0], (cy - r.top) / r.height * VB[3] + VB[1]];
}

svgEl.addEventListener("wheel", ev => {
  ev.preventDefault();
  const p = clientToSvg(ev.clientX, ev.clientY);
  /* ctrlKey 为真时是触控板双指捏合，按手势幅度连续缩放；普通滚轮按档缩放 */
  const factor = ev.ctrlKey ? Math.exp(-ev.deltaY * 0.012) : (ev.deltaY < 0 ? 1.12 : 1 / 1.12);
  zoomAt(p[0], p[1], factor);
}, { passive: false });

let touchPinchDist = 0, touchPinchFX = 0, touchPinchFY = 0;
svgEl.addEventListener("touchstart", ev => {
  if (ev.touches.length === 2) {
    const dx = ev.touches[0].clientX - ev.touches[1].clientX;
    const dy = ev.touches[0].clientY - ev.touches[1].clientY;
    touchPinchDist = Math.sqrt(dx * dx + dy * dy);
    const cx = (ev.touches[0].clientX + ev.touches[1].clientX) / 2;
    const cy = (ev.touches[0].clientY + ev.touches[1].clientY) / 2;
    const p = clientToSvg(cx, cy);
    touchPinchFX = p[0]; touchPinchFY = p[1];
  }
}, { passive: false });
svgEl.addEventListener("touchmove", ev => {
  if (ev.touches.length === 2 && touchPinchDist) {
    ev.preventDefault();
    const dx = ev.touches[0].clientX - ev.touches[1].clientX;
    const dy = ev.touches[0].clientY - ev.touches[1].clientY;
    const d = Math.sqrt(dx * dx + dy * dy);
    zoomAt(touchPinchFX, touchPinchFY, d / touchPinchDist);
    touchPinchDist = d;
  }
}, { passive: false });

let isDown = false, isPointerMoving = false;
let startX = 0, startY = 0, lastX = 0, lastY = 0;
function onDown(ev) {
  if (ev.touches && ev.touches.length > 1) return;
  isDown = true; isPointerMoving = false;
  const p = ev.touches ? ev.touches[0] : ev;
  startX = lastX = p.clientX; startY = lastY = p.clientY;
  wrap.classList.add("dragging");
}
function onMove(ev) {
  if (!isDown) return;
  const p = ev.touches ? ev.touches[0] : ev;
  if (Math.abs(p.clientX - startX) > 4 || Math.abs(p.clientY - startY) > 4) isPointerMoving = true;
  if (isPointerMoving) {
    if (ev.cancelable) ev.preventDefault();
    const a = clientToSvg(lastX, lastY);
    const b = clientToSvg(p.clientX, p.clientY);
    tx += b[0] - a[0];
    ty += b[1] - a[1];
    lastX = p.clientX; lastY = p.clientY;
    applyTransform();
  }
}
function onUp() {
  isDown = false;
  wrap.classList.remove("dragging");
  /* 拖拽结束后必须复位，否则之后的所有点击都会被误判为拖拽而永久失效。
     延迟一拍：让紧随 mouseup 的那次 click 仍被识别为拖拽，之后的正常点击不受影响。 */
  if (isPointerMoving) setTimeout(function () { isPointerMoving = false; }, 0);
}
svgEl.addEventListener("mousedown", onDown);
window.addEventListener("mousemove", onMove);
window.addEventListener("mouseup", onUp);
svgEl.addEventListener("touchstart", onDown, { passive: false });
window.addEventListener("touchmove", onMove, { passive: false });
window.addEventListener("touchend", onUp);

document.getElementById("zIn").addEventListener("click", () => { zoomAt(VB[0] + VB[2] / 2, VB[1] + VB[3] / 2, 1.3); });
document.getElementById("zOut").addEventListener("click", () => { zoomAt(VB[0] + VB[2] / 2, VB[1] + VB[3] / 2, 1 / 1.3); });
document.getElementById("zReset").addEventListener("click", resetView);
function resetView() {
  if (typeof scale === "undefined") return;
  scale = 1; tx = 0; ty = 0; applyTransform(); }

/* ---------- 工具按钮 ---------- */
function geoHLCount() {
  let n = 0;
  Object.keys(geoHL).forEach(() => n++);
  return n;
}
function updateStatus() {
  const p = Object.keys(hlState).length, g = geoHLCount();
  const st = document.getElementById("status");
  const parts = [];
  if (p) parts.push(p + " 省");
  if (g) parts.push(g + " 地理要素");
  st.textContent = (p || g) ? ("已高亮 " + parts.join(" + ") + " · 再点击可恢复") : "就绪 · 点击省份/水系/山脉高亮";
}
document.getElementById("btnOne").addEventListener("click", () => {
  const names = Object.keys(elsByName).filter(n => !hlState[n]);
  if (names.length) toggleHL(names[Math.floor(Math.random() * names.length)]);
});
document.getElementById("btnAll").addEventListener("click", () => {
  Object.keys(elsByName).forEach(nm => { if (!hlState[nm]) { hlState[nm] = randColor(); applyHL(nm, hlState[nm]); } });
  updateStatus();
});
function clearGeoAll() {
  Object.keys(geoHL).forEach(key => {
    const m = key.match(/^([^:]+)::(.+)$/);
    if (m) clearGeoHL(m[1], m[2]);
  });
}
function doClear() {
  /* 必须先 delete 状态再 clearHL：否则 clearHL 内的 syncProvNameFX
     仍会读到 hlState[name] 为真，导致名称缩放动画残留。 */
  Object.keys(hlState).forEach(name => { delete hlState[name]; clearHL(name); });
  clearGeoAll();
  if (hoverName) clearHover(hoverName, hoverKind);
  refreshHover();                     /* 鼠标仍停在要素上时补回悬停视觉 */
  updateStatus();
}
document.getElementById("btnClear").addEventListener("click", doClear);
document.getElementById("btnReset").addEventListener("click", () => {
  doClear(); resetView(); applyTheme("dark"); clearGeoAll(); updateStatus();
});

/* ---------- 键盘 ---------- */
window.addEventListener("keydown", ev => {
  const cx = VB[0] + VB[2] / 2, cy = VB[1] + VB[3] / 2;
  if (ev.key === "+" || ev.key === "=") zoomAt(cx, cy, 1.2);
  else if (ev.key === "-" || ev.key === "_") zoomAt(cx, cy, 1 / 1.2);
  else if (ev.key === "0") resetView();
  else if (ev.key === "Escape") doClear();
});

/* ---------- 启动 ---------- */
applyVisuals();
applyTheme("dark");
resetView();
updateStatus();
console.log("[地图] 省份数:", Object.keys(elsByName).length, " 包围盒:", VB.join(","));


</script>
