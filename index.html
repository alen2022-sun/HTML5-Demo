<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HTML5-Demo</title>
<style>
body {
  font-family: system-ui;
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
}
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.card {
  border: 1px solid #ddd;
  border-radius: 8px;
  padding: 16px;
  text-align: center;
}
a {
  text-decoration: none;
  color: #0969da;
  font-weight: 600;
}
</style>
</head>
<body>

<h1>🎮 HTML5-Demo</h1>
<div class="grid" id="list"></div>

<script>
fetch('files.json')
  .then(res => res.json())
  .then(files => {
    const list = document.getElementById('list');
    files.forEach(file => {
      const name = file.replace('.html', '');
      list.innerHTML += `
        <div class="card">
          <a href="./${file}" target="_blank">${name}</a>
        </div>
      `;
    });
  });
</script>

</body>
</html>
