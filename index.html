<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HTML5-Demo 浏览入口</title>
    <style>
        body { font-family: system-ui; max-width: 800px; margin: 40px auto; padding: 0 20px; background: #f6f8fa; }
        h1 { text-align: center; margin-bottom: 40px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; }
        .card { background: #fff; border: 1px solid #d0d7de; border-radius: 6px; padding: 20px; text-align: center; }
        a { color: #0969da; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <h1>HTML5-Demo 浏览入口</h1>
    <div class="grid" id="list">加载中...</div>
    <script>
        fetch('./files.json')
            .then(res => res.json())
            .then(files => {
                const list = document.getElementById('list');
                list.innerHTML = '';
                files.forEach(f => {
                    const name = f.split('/').pop().replace('.html', '').replace(/-/g, ' ');
                    list.innerHTML += `<div class="card"><a href="./${f}" target="_blank">${name}</a></div>`;
                });
            })
            .catch(err => document.getElementById('list').innerHTML = '⚠️ 加载失败，请确认 files.json 在根目录');
    </script>
</body>
</html>
