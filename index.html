<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML5-Demo · 作品集</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
:root{
  --bg:#f3f7ff;
  --ink:#101a33;
  --ink-2:#5a6b8c;
  --ink-3:#8b9ab8;
  --glass:rgba(255,255,255,.72);
  --glass-strong:rgba(255,255,255,.92);
  --line:rgba(90,120,200,.16);
  --shadow:0 12px 34px rgba(46,78,160,.10);
  --shadow-hover:0 22px 54px rgba(46,78,160,.18);
  --c1:#4f6bff;
  --c2:#00b8d4;
  --c3:#8b5cf6;
  --grad:linear-gradient(120deg,#4f6bff,#00b8d4 55%,#8b5cf6);
  --soft:linear-gradient(120deg,rgba(79,107,255,.10),rgba(0,184,212,.10),rgba(139,92,246,.10));
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{min-height:100%;background:var(--bg);color:var(--ink);
  font-family:'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased}

/* 未来感光晕 + 极细网格 */
body::before{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(700px 480px at 12% 6%, rgba(79,107,255,.15), transparent 70%),
    radial-gradient(620px 420px at 88% 16%, rgba(0,184,212,.14), transparent 70%),
    radial-gradient(760px 520px at 70% 94%, rgba(139,92,246,.11), transparent 70%);
}
body::after{
  content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.4;
  background-image:
    linear-gradient(rgba(90,120,200,.07) 1px,transparent 1px),
    linear-gradient(90deg,rgba(90,120,200,.07) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,transparent 78%);
  mask-image:linear-gradient(180deg,#000 0%,transparent 78%);
}

/* 顶部渐变细线 */
.topbar{position:fixed;top:0;left:0;right:0;height:3px;z-index:20;background:var(--grad)}

.container{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding:54px 24px 56px}

/* ---------- Header ---------- */
header{text-align:center;margin-bottom:44px}
.eyebrow{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;margin-bottom:20px;
  border:1px solid var(--line);border-radius:999px;background:var(--glass-strong);
  font-size:10px;letter-spacing:2.2px;color:var(--ink-2);text-transform:uppercase;
  box-shadow:0 4px 16px rgba(46,78,160,.06)}
.eyebrow i{width:6px;height:6px;border-radius:50%;background:var(--c2);
  box-shadow:0 0 0 4px rgba(0,184,212,.16)}
header .logo{font-size:46px;margin-bottom:10px;filter:drop-shadow(0 8px 18px rgba(79,107,255,.22))}
header h1{font-size:clamp(26px,5vw,38px);font-weight:800;letter-spacing:1.5px;margin-bottom:10px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;color:transparent}
header p{color:var(--ink-2);font-size:14px;max-width:540px;margin:0 auto;line-height:1.75}

.stats{display:flex;justify-content:center;gap:14px;margin-top:26px;flex-wrap:wrap}
.stat{min-width:108px;text-align:center;padding:14px 22px;
  background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);border-radius:16px;
  box-shadow:var(--shadow);backdrop-filter:blur(14px)}
.stat .num{font-size:25px;font-weight:800;letter-spacing:-.5px;
  background:var(--grad);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.stat .label{font-size:10px;color:var(--ink-3);letter-spacing:1.6px;margin-top:3px;text-transform:uppercase}

.search-wrap{max-width:430px;margin:26px auto 0;position:relative}
.search-wrap .search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.55}
.search-wrap input{width:100%;padding:13px 18px 13px 44px;
  background:var(--glass-strong);border:1px solid rgba(255,255,255,.9);border-radius:14px;
  color:var(--ink);font-size:14px;outline:none;box-shadow:var(--shadow);
  backdrop-filter:blur(14px);transition:border-color .25s,box-shadow .25s}
.search-wrap input::placeholder{color:var(--ink-3)}
.search-wrap input:focus{border-color:rgba(79,107,255,.55);box-shadow:0 0 0 4px rgba(79,107,255,.12),var(--shadow)}

/* ---------- Grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:20px;margin-top:38px}

/* 关键修复：整张卡片只有一个 <a>，内部绝不再嵌套 <a> */
.card{position:relative;display:flex;flex-direction:column;min-height:220px;padding:24px;
  text-decoration:none;color:inherit;overflow:hidden;
  background:var(--glass);border:1px solid rgba(255,255,255,.92);border-radius:20px;
  box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(1.15);
  transition:transform .32s cubic-bezier(.2,.8,.2,1),box-shadow .32s,border-color .32s}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;
  background:var(--grad);opacity:0;transition:opacity .3s}
.card::after{content:'';position:absolute;width:190px;height:190px;right:-72px;top:-72px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,184,212,.20),transparent 70%);
  opacity:0;transition:opacity .35s;pointer-events:none}
.card:hover{transform:translateY(-6px);box-shadow:var(--shadow-hover);border-color:rgba(79,107,255,.34)}
.card:hover::before,.card:hover::after{opacity:1}

.card-idx{position:absolute;top:18px;right:20px;font:600 11px ui-monospace,SFMono-Regular,Menlo,monospace;
  color:var(--ink-3);letter-spacing:1px}

.card-top{display:flex;align-items:flex-start;gap:14px;margin-bottom:14px;padding-right:34px}
.card-icon{font-size:32px;flex:none;width:56px;height:56px;display:grid;place-items:center;
  background:var(--soft);border:1px solid rgba(255,255,255,.9);border-radius:16px;
  box-shadow:inset 0 1px 0 #fff,0 6px 16px rgba(46,78,160,.08)}
.card-title{font-size:17px;font-weight:750;line-height:1.35;margin-bottom:4px;color:var(--ink)}
.card-file{font:500 10.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--ink-3)}

.card-desc{font-size:13px;color:var(--ink-2);line-height:1.7;flex:1;margin-bottom:16px}

.card-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:auto}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{padding:4px 11px;background:rgba(79,107,255,.07);border:1px solid rgba(79,107,255,.16);
  border-radius:999px;font-size:10px;color:var(--c1);font-weight:600;letter-spacing:.4px}
.go{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;
  background:var(--glass-strong);border:1px solid var(--line);color:var(--c1);font-size:15px;
  transition:background .28s,color .28s,transform .28s,border-color .28s}
.card:hover .go{background:var(--grad);border-color:transparent;color:#fff;transform:rotate(45deg)}

.empty{grid-column:1/-1;text-align:center;padding:60px 0;color:var(--ink-3);font-size:14px}

/* ---------- Footer ---------- */
footer{text-align:center;margin-top:60px;padding-top:26px;border-top:1px solid var(--line)}
footer p{font-size:11px;color:var(--ink-3);line-height:1.9}
footer a{color:var(--c1);text-decoration:none;font-weight:600}
footer a:hover{text-decoration:underline}

@media(max-width:600px){
  .container{padding:38px 16px 40px}
  .grid{grid-template-columns:1fr}
  header h1{font-size:24px}
  .stats{gap:8px}
  .stat{min-width:92px;padding:12px 14px}
}
</style>
</head>
<body>
<div class="topbar"></div>

<div class="container">
  <header>
    <div class="eyebrow"><i></i>STATIC · OFFLINE · ZERO DEPENDENCY</div>
    <div class="logo">🎮</div>
    <h1>HTML5-Demo 作品集</h1>
    <p>纯前端交互式 Demo 合集 · 无需后端 · 单文件即可运行<br>涵盖地图可视化、3D 引擎、塔防游戏、FPS 射击、终端模拟等</p>

    <div class="stats">
      <div class="stat"><div class="num" id="totalCount">0</div><div class="label">个作品</div></div>
      <div class="stat"><div class="num">100%</div><div class="label">离线可用</div></div>
      <div class="stat"><div class="num">0ms</div><div class="label">后端延迟</div></div>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="search" placeholder="搜索作品名称、描述或标签...">
    </div>
  </header>

  <div class="grid" id="grid"><div class="empty">正在载入作品列表…</div></div>

  <footer>
    <p>
      HTML5-Demo · 纯前端作品集<br>
      部署于 <a href="https://pages.github.com/" target="_blank" rel="noopener">GitHub Pages</a> ·
      源码 <a href="https://github.com/alen2022-sun/HTML5-Demo" target="_blank" rel="noopener">GitHub</a>
    </p>
  </footer>
</div>

<script>
const grid = document.getElementById('grid');
let allItems = [];

// 简单转义，避免 files.json 里的特殊字符破坏 HTML
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
}[c]));

fetch('./files.json')
  .then(r => {
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return r.json();
  })
  .then(items => {
    allItems = items;
    document.getElementById('totalCount').textContent = items.length;
    render(items);
  })
  .catch(() => {
    grid.innerHTML = '<div class="empty">⚠️ 加载失败，请确认根目录存在 files.json，并等待 Pages 部署完成后强刷</div>';
  });

function render(items) {
  if (!items.length) {
    grid.innerHTML = '<div class="empty">没有找到匹配的作品</div>';
    return;
  }
  grid.innerHTML = items.map((item, i) => `
    <a class="card" href="./${esc(item.file)}" target="_blank" rel="noopener"
       aria-label="打开 ${esc(item.title)}">
      <span class="card-idx">#${String(i + 1).padStart(2, '0')}</span>
      <div class="card-top">
        <div class="card-icon">${esc(item.icon || '📄')}</div>
        <div>
          <div class="card-title">${esc(item.title)}</div>
          <div class="card-file">${esc(String(item.file).replace('source/', ''))}</div>
        </div>
      </div>
      <div class="card-desc">${esc(item.desc)}</div>
      <div class="card-foot">
        <div class="card-tags">${(item.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div>
        <span class="go">↗</span>
      </div>
    </a>
  `).join('');
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  render(allItems.filter(item =>
    item.title.toLowerCase().includes(q) ||
    item.desc.toLowerCase().includes(q) ||
    (item.tags || []).some(t => String(t).toLowerCase().includes(q)) ||
    item.file.toLowerCase().includes(q)
  ));
});
</script>
</body>
</html>
