<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HTML5-Demo · 作品集</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
  :root {
    --bg: #0a0e1a;
    --card-bg: rgba(255,255,255,0.06);
    --card-border: rgba(255,255,255,0.12);
    --card-hover: rgba(255,255,255,0.12);
    --text: #e4e8f0;
    --text-dim: #8a9ab0;
    --accent: #7fe9ff;
    --accent2: #4de2ff;
    --tag-bg: rgba(127,233,255,0.12);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; min-height:100%; background:var(--bg); color:var(--text);
    font-family: 'Inter','PingFang SC','Microsoft YaHei',system-ui,sans-serif; }
  
  /* 背景 */
  body::before {
    content:''; position:fixed; inset:0; z-index:0;
    background: radial-gradient(ellipse at 30% 20%, rgba(77,226,255,0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 80%, rgba(127,233,255,0.05) 0%, transparent 60%);
    pointer-events:none;
  }

  .container { position:relative; z-index:1; max-width:1200px; margin:0 auto; padding:40px 24px 60px; }

  /* 头部 */
  header { text-align:center; margin-bottom:48px; }
  header .logo { font-size:48px; margin-bottom:12px; }
  header h1 { font-size:32px; font-weight:800; letter-spacing:2px; margin-bottom:8px;
    background: linear-gradient(135deg,var(--accent),#b28bff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  header p { color:var(--text-dim); font-size:14px; max-width:500px; margin:0 auto; line-height:1.6; }

  /* 统计 */
  .stats { display:flex; justify-content:center; gap:24px; margin-top:20px; flex-wrap:wrap; }
  .stat { text-align:center; padding:12px 20px; background:var(--card-bg); border:1px solid var(--card-border); border-radius:10px; }
  .stat .num { font-size:24px; font-weight:700; color:var(--accent); }
  .stat .label { font-size:11px; color:var(--text-dim); letter-spacing:1px; margin-top:2px; }

  /* 网格 */
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(340px, 1fr)); gap:20px; margin-top:36px; }

  /* 卡片 */
  .card { position:relative; background:var(--card-bg); border:1px solid var(--card-border); border-radius:14px;
    padding:22px; transition: all .25s ease; overflow:hidden; display:flex; flex-direction:column; min-height:200px; }
  .card::before { content:''; position:absolute; top:0; left:0; right:0; height:3px;
    background: linear-gradient(90deg,var(--accent),transparent); opacity:0; transition:opacity .3s; }
  .card:hover { background:var(--card-hover); border-color:rgba(127,233,255,0.3);
    transform:translateY(-3px); box-shadow:0 12px 40px rgba(0,0,0,0.4),0 0 20px rgba(127,233,255,0.08); }
  .card:hover::before { opacity:1; }

  .card-top { display:flex; align-items:flex-start; gap:14px; margin-bottom:12px; }
  .card-icon { font-size:40px; flex:none; width:56px; height:56px; display:grid; place-items:center;
    background:rgba(255,255,255,0.05); border-radius:12px; border:1px solid var(--card-border); }
  .card-title { font-size:16px; font-weight:700; line-height:1.3; margin-bottom:4px; }
  .card-file { font-size:10px; color:var(--text-dim); font-family:monospace; opacity:0.7; }

  .card-desc { font-size:13px; color:var(--text-dim); line-height:1.6; flex:1; margin-bottom:14px; }

  .card-tags { display:flex; gap:6px; flex-wrap:wrap; }
  .tag { padding:3px 10px; background:var(--tag-bg); border:1px solid rgba(127,233,255,0.2);
    border-radius:20px; font-size:10px; color:var(--accent); letter-spacing:0.5px; }

  .card-link { position:absolute; inset:0; z-index:2; }

  /* 页脚 */
  footer { text-align:center; margin-top:60px; padding-top:24px; border-top:1px solid var(--card-border); }
  footer p { font-size:11px; color:var(--text-dim); line-height:1.8; }
  footer a { color:var(--accent); text-decoration:none; }

  /* 搜索 */
  .search-wrap { max-width:400px; margin:24px auto 0; }
  .search-wrap input { width:100%; padding:12px 18px; background:var(--card-bg); border:1px solid var(--card-border);
    border-radius:10px; color:var(--text); font-size:14px; outline:none; transition:border-color .2s; }
  .search-wrap input:focus { border-color:var(--accent); }
  .search-wrap input::placeholder { color:var(--text-dim); opacity:0.5; }

  /* 响应式 */
  @media(max-width:600px) {
    header h1 { font-size:24px; }
    .grid { grid-template-columns:1fr; }
    .container { padding:24px 16px 40px; }
  }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="logo">🎮</div>
    <h1>HTML5-Demo 作品集</h1>
    <p>纯前端交互式 Demo 合集 · 无需后端 · 单文件即可运行<br>涵盖地图可视化、3D 引擎、塔防游戏、FPS 射击、终端模拟等</p>
    <div class="stats">
      <div class="stat"><div class="num" id="totalCount">0</div><div class="label">个作品</div></div>
      <div class="stat"><div class="num">100%</div><div class="label">离线可用</div></div>
      <div class="stat"><div class="num">0ms</div><div class="label">后端延迟</div></div>
    </div>
    <div class="search-wrap">
      <input type="text" id="search" placeholder="🔍 搜索作品名称、描述或标签...">
    </div>
  </header>

  <div class="grid" id="grid"></div>

  <footer>
    <p>
      HTML5-Demo · 纯前端作品集<br>
      部署于 <a href="https://pages.github.com/" target="_blank">GitHub Pages</a> ·
      源码 <a href="https://github.com/alen2022-sun/HTML5-Demo" target="_blank">GitHub</a><br>
      <span style="opacity:0.5">Last updated: 2024</span>
    </p>
  </footer>
</div>

<script>
  let allItems = [];

  fetch('./files.json')
    .then(r => r.json())
    .then(items => {
      allItems = items;
      document.getElementById('totalCount').textContent = items.length;
      render(items);
    })
    .catch(err => {
      document.getElementById('grid').innerHTML = '<p style="text-align:center;color:#ff6b6b">⚠️ 加载失败，请确认 files.json 存在</p>';
    });

  function render(items) {
    const grid = document.getElementById('grid');
    if (items.length === 0) {
      grid.innerHTML = '<p style="text-align:center;color:var(--text-dim);grid-column:1/-1">没有找到匹配的作品</p>';
      return;
    }
    grid.innerHTML = items.map(item => `
      <a class="card" href="./${item.file}" target="_blank">
        <div class="card-top">
          <div class="card-icon">${item.icon || '📄'}</div>
          <div>
            <div class="card-title">${item.title}</div>
            <div class="card-file">${item.file.replace('source/','')}</div>
          </div>
        </div>
        <div class="card-desc">${item.desc}</div>
        <div class="card-tags">
          ${(item.tags||[]).map(t => `<span class="tag">${t}</span>`).join('')}
        </div>
        <a class="card-link" href="./${item.file}" target="_blank"></a>
      </a>
    `).join('');
  }

  // 搜索
  document.getElementById('search').addEventListener('input', e => {
    const q = e.target.value.toLowerCase();
    const filtered = allItems.filter(item =>
      item.title.toLowerCase().includes(q) ||
      item.desc.toLowerCase().includes(q) ||
      (item.tags||[]).some(t => t.toLowerCase().includes(q)) ||
      item.file.toLowerCase().includes(q)
    );
    render(filtered);
  });
</script>
</body>
</html>
